# US915, sub-band 2: channels 8-15 plus 65.
#
# CONCENTRATORD_REGION  concentratord's `[gateway] region`.
# TOPIC_PREFIX          the ChirpStack region id whose topics the gateway
#                       publishes under. Production calls this plan "us915_0";
#                       the name is ChirpStack's label for the region, not the
#                       sub-band, and it must match region_*.toml server-side.
# LBT_REQUIRED          whether listen-before-talk is mandatory here.
CONCENTRATORD_REGION="US915"
TOPIC_PREFIX="us915_0"
LBT_REQUIRED="0"
