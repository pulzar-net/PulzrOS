# RAK7289V2 — WisGate Edge Pro V2, 16-channel, no LTE.
#
# The RAK7289CV2 without its modem: the same RAK636 module, the same two
# RAK5146 mPCIe cards on USB. ChirpStack's OpenWrt feed (MIT,
# chirpstack-concentratord-target-rak7289v2) configures its two slots as this
# repo does the CV2's -- rak_5146 on the first and second CDC-ACM ports, GNSS
# on the first card, reset on GPIO 11 for the first -- and ChirpStack Gateway
# OS builds every RAK636 board from one device profile. So this is the CV2's
# device support and image with the cellular side left out.
#
# Not yet run on a V2 unit. The hub-port mapping (PULZR_LORA_USB_PORTS) and
# the power board are the CV2's and are the things to confirm first.

. "${BOARDS_DIR}/rak7289cv2/board.conf"

BOARD_ID="rak7289v2"
BOARD_NAME="RAK7289V2 WisGate Edge Pro"
PULZR_FEATURES="lorawan wifi gnss"
PULZR_LED_CELLULAR=""
PULZR_WAN_CELL_ENABLED="0"

# Modbus is built into the CV2's image because that unit is the bench board for
# it; everywhere else pulzr-edge is an add-on (scripts/check-addons.sh), this
# Pro included, until a V2 unit has been through the same bench.
PULZR_ADDONS_BUILTIN=""
