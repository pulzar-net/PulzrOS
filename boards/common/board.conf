# Shared board definition. Every board in boards/<id>/board.conf sources this
# first and then overrides only what is actually different about it.
#
# The point of this file is that adding a board should be a page of deltas, not
# a fork. If you find yourself copying more than ~20 lines out of here into a
# board, the thing you copied belongs here instead.

# ─── OpenWrt release ────────────────────────────────────────────────────────
# Pinned, not "latest". An image built today and an image built in six months
# must contain the same kernel unless somebody chose otherwise in a commit.
OPENWRT_VERSION="25.12.6"

# ─── Packages every Pulzar gateway has ─────────────────────────────────────
# LuCI is absent on purpose and its removal is asserted in PACKAGES_REMOVE
# below: the Pulzar console replaces it, and shipping both would mean two
# unrelated ways to change the same UCI state with two different auth models.
PACKAGES_COMMON="
  pulzr-base
  pulzr-console
  pulzr-wireguard
  pulzr-adopt
  pulzr-io
  pulzr-mqtt
  pulzr-tui

  ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-math
  ucode-mod-digest ucode-mod-struct
  rpcd rpcd-mod-file rpcd-mod-iwinfo
  uhttpd uhttpd-mod-ucode

  ca-bundle ca-certificates

  # OpenSSH instead of dropbear, because Pulzar Cloud reaches a gateway's
  # shell with a five-minute certificate for that gateway alone and dropbear
  # cannot check one. See pulzr-ssh-setup. On mipsel it costs about 860KB of
  # packages against dropbear's 110KB (openssh-server 545KB, openssh-keygen
  # 190KB, libfido2 and what it pulls 110KB, dropbearconvert 23KB); libopenssl3
  # and zlib are in the image already. dropbearconvert carries dropbear's host
  # keys over on the first boot after the switch, and can go once no gateway
  # runs an image older than that.
  openssh-server openssh-sftp-server dropbearconvert

  # mDNS, so the console answers at <hostname>.local on a directly-connected
  # laptop regardless of which role the ethernet port took. This is what makes
  # a wrong role guess a nuisance rather than a lockout.
  umdns

  # The Thread border router's wpan0 is a tun device. Add-ons cannot bring a
  # kernel module (it is built for one kernel, and the image's is the only one
  # a gateway has), so the one an add-on's OpenWrt package needs is here; 12 KB.
  kmod-tun

  usbutils pciutils
  jshn jsonfilter
  logd
  urngd
"

# Explicitly torn out rather than merely not added. ImageBuilder profiles pull
# a default package set, and on several targets that set includes LuCI.
PACKAGES_REMOVE="
  luci luci-ssl luci-base luci-mod-admin-full luci-theme-bootstrap
  uhttpd-mod-lua
  dnsmasq
  wpad-basic-mbedtls
  dropbear
"
# dnsmasq goes because pulzr-base installs dnsmasq-full instead — we need
# the DHCP option handling and the ipset support that the -full build has.
# wpad-basic-mbedtls goes for the same reason: the device profiles pull it in,
# the wifi feature installs the full wpad-openssl for WPA2-Enterprise, and the two
# conflict. It costs about 470KB uncompressed on mipsel, ~200KB in squashfs.
# dropbear goes because sshd replaces it on port 22; see PACKAGES_COMMON.
PACKAGES_COMMON="${PACKAGES_COMMON} dnsmasq-full"
# What is on the other end of each port, when it announces itself (LLDP,
# CDP): receive-only, see 29-pulzr-ports. About 125KB, with libevent2.
PACKAGES_COMMON="${PACKAGES_COMMON} lldpd"
# Radios plugged in by USB, on every board, so "plug it in" works on a gateway
# nobody has touched: pulzr-probe names them (and is the only thing that opens
# a serial port nobody has claimed), and these are the drivers the Zigbee,
# Z-Wave and Thread dongles and the Bluetooth ones we list use. CP210x
# (SkyConnect, ZBT-1, SONOFF -P, SLZB-07, HUSBZB-1), CH340 and CH9102 (CDC
# ACM, as SONOFF -E and most Z-Wave 800 sticks enumerate), FTDI (ConBee III),
# PL2303, and btusb with RTL8761B's firmware (CSR8510 needs none). A few
# hundred KB together; kmod-bluetooth is most of it.
PACKAGES_COMMON="${PACKAGES_COMMON}
  pulzr-probe
  kmod-usb-serial-cp210x kmod-usb-serial-ch341 kmod-usb-serial-ftdi kmod-usb-serial-pl2303
  kmod-usb-acm
  kmod-btusb rtl8761bu-firmware
"

# ─── Features ───────────────────────────────────────────────────────────────
#
# What this board is for, as words. Each word puts its package group in the
# image, its pages in the console and its endpoints in the API; a word that is
# not listed costs the board nothing. A RAK gateway was carrying ModemManager
# with no modem slot to speak of and the Opal was carrying a LoRa stack with no
# radio, because everything was in PACKAGES_COMMON. See docs/src/content/docs/features.md.
#
#   lorawan    the concentrator, ChirpStack and the uplink buffer
#   gnss       the position page; needs PULZR_GPS other than none
#   wifi       the WiFi uplink and the setup AP
#   lan        the devlan zone: DHCP, reservations, per-MAC policy, the tunnel
#              forward; needs PULZR_LAN_PORTS
#   dns        upstream servers, local names, rebind protection
#   failover   the uplink order, and tracking that moves off an uplink that
#              carries nothing; needs a second uplink, so cellular (built
#              in or an add-on the board may take) or wifi
#   speedtest  daily speed tests of each wired and WiFi uplink and of the
#              tunnel; librespeed-cli is a 10MB Go binary, so not on a board
#              with PULZR_FLASH_CONSTRAINED
#
# Cellular is not a word: it is the add-on pulzr-cellular, built into the
# image where the modem is soldered on and offered where it is plugged in
# (see "Cellular" below).
#
# No word opens a way into the LAN. The tunnel forward the cloud asks for
# (lan-forward) is the only one, so there is no uplink port forward, no site
# VPN and no firewall editor, however much GL.iNet's UI has them.
# pulzr_check_features enforces the "needs".
PULZR_FEATURES="lorawan wifi"

PULZR_FEATURE_WORDS="lorawan gnss wifi lan dns failover speedtest"

PACKAGES_LORAWAN="
  pulzr-concentrator

  # Concentrator access. spi-tools gives us spi-pipe, which is how
  # sx130x_probe reads the chip version register on a kit board without a
  # compiled helper. libgpiod supplies gpioset for the SX130x reset line; the
  # sysfs GPIO interface it replaces is deprecated upstream and absent on some
  # targets. The package is gpiod-tools, not libgpiod-utils — the latter does
  # not exist in 24.10 or 25.12.
  spi-tools gpiod-tools

  # The LoRa gateway itself: ChirpStack Concentratord and MQTT Forwarder,
  # built with the OpenWrt SDK (sdk/).
  chirpstack-concentratord-sx1302 chirpstack-mqtt-forwarder

  # The local broker that holds uplinks when they cannot be sent — see
  # pulzr-lora-buffer. 640KB installed, carried on every LoRaWAN board even though
  # buffering is off by default, because the alternative is a feature that is
  # a firmware upgrade away rather than a setting away. -ssl and not -nossl:
  # the bridge out is TLS on 8883.
  mosquitto-ssl
"

# ─── Add-ons ────────────────────────────────────────────────────────────────
#
# An add-on is a feed package with an `addon` file (pulzr-edge, Modbus): not
# in the image, installed on a running gateway from this release's signed
# repository by pulzr-addon. See docs/src/content/docs/addons.md.
#
#   PULZR_ADDONS_URL      where each release's repository is, under v<version>/.
#                         Public, immutable per tag; staff may point a bench
#                         unit elsewhere with pulzr_addons.main.url.
#   PULZR_ADDONS_BUILTIN  add-ons this board's image carries anyway, which
#                         upgrade with the image and cannot be removed:
#                         pulzr-cellular on the boards with a soldered modem,
#                         and pulzr-modbus on the RAK7289CV2 alone, whose power
#                         board already talks Modbus; scripts/check-addons.sh
#                         keeps pulzr-modbus out of every other image, the
#                         RAK7268CV2s in production above all.
PULZR_ADDONS_URL="https://assets.pkze.us/pulzros/addons"
PULZR_ADDONS_BUILTIN=""

# ─── Cellular ───────────────────────────────────────────────────────────────
#
# The add-on pulzr-cellular: ModemManager and the wwan uplink, and usbwan for
# a HiLink dongle or a tethered phone. ModemManager rather than uqmi: 24.10
# shipped no uqmi for any architecture, and ModemManager is where OpenWrt's
# modem support went. With glib, libqmi and libmbim it is about 4 MB
# installed, and on the Opal's 115 MB of RAM it ran with nothing plugged in.
#
#   built in   a board whose modem is soldered on lists it in
#              PULZR_ADDONS_BUILTIN (the RAK7268C, RAK7268CV2, RAK7289CV2):
#              in the image, upgraded with it, never removed.
#   add-on     a board in feed/pulzr-cellular/addon's ADDON_BOARDS without
#              it built in: the modem is whatever is plugged into a USB host
#              port. pulzr-radios reports one plugged in, and Pulzar Net
#              offers the add-on. Its drivers per architecture are in
#              feed/pulzr-cellular/arches.
#   neither    no cellular: PULZR_WAN_CELL_ENABLED must be 0.

# The full wpad, not the basic one the profiles pull: WPA2-Enterprise sites.
# iw for the radios page: its `iw phy info` is the only place the console
# learns which channels, widths and interface combinations a radio allows
# (lib/radios.uc), and not every profile pulls it. The radio's own driver
# stays with the board.
PACKAGES_WIFI="pulzr-ap wpad-openssl iw"

# ip-bridge for the console's port column: which port a client is behind.
PACKAGES_LAN="pulzr-lan ip-bridge"

PACKAGES_DNS="pulzr-dns"
PACKAGES_FAILOVER="pulzr-uplinks"
PACKAGES_SPEEDTEST="pulzr-speedtest"
PACKAGES_GNSS=""

has_feature() {
  case " ${PULZR_FEATURES} " in *" $1 "*) return 0 ;; esac
  return 1
}

# Whether this board has cellular in its image, or may take the add-on.
cellular_builtin() {
  case " ${PULZR_ADDONS_BUILTIN:-} " in *" pulzr-cellular "*) return 0 ;; esac
  return 1
}
cellular_possible() {
  cellular_builtin && return 0
  ( . "${BOARDS_DIR}/../feed/pulzr-cellular/addon"
    case " ${ADDON_BOARDS} " in *" ${BOARD_ID} "*) exit 0 ;; esac
    exit 1 )
}

# Refuses a board that asks for something it cannot have. Called by build.sh
# and scripts/check-deps.sh after the board's file has had its say, so the
# answer is about the board, not about these defaults.
pulzr_check_features() {
  local word known k name colour role label
  for word in ${PULZR_FEATURES}; do
    known=0
    for k in ${PULZR_FEATURE_WORDS}; do [ "${k}" = "${word}" ] && known=1; done
    [ "${known}" = 1 ] || { echo "${BOARD_ID}: unknown feature '${word}'" >&2; return 1; }
  done
  if has_feature lan && [ -z "${PULZR_LAN_PORTS}" ]; then
    echo "${BOARD_ID}: lan needs PULZR_LAN_PORTS" >&2; return 1
  fi
  if ! cellular_possible && [ "${PULZR_WAN_CELL_ENABLED}" = 1 ]; then
    echo "${BOARD_ID}: PULZR_WAN_CELL_ENABLED with no cellular, built in or as an add-on" >&2; return 1
  fi
  # Ethernet is on every board; failing over needs somewhere to go.
  if has_feature failover && ! cellular_possible && ! has_feature wifi; then
    echo "${BOARD_ID}: failover needs a second uplink: cellular or wifi" >&2; return 1
  fi
  if has_feature speedtest && [ "${PULZR_FLASH_CONSTRAINED:-0}" = 1 ]; then
    echo "${BOARD_ID}: speedtest does not fit a flash-constrained board" >&2; return 1
  fi
  if has_feature gnss && [ "${PULZR_GPS}" = none ]; then
    echo "${BOARD_ID}: gnss with PULZR_GPS=none" >&2; return 1
  fi
  # A built-in name that is not an add-on would install as a plain package and
  # report as nothing: pulzr-addon knows only what has an addon file.
  for word in ${PULZR_ADDONS_BUILTIN:-}; do
    [ -f "${BOARDS_DIR}/../feed/${word}/addon" ] || {
      echo "${BOARD_ID}: PULZR_ADDONS_BUILTIN names ${word}, which has no feed/${word}/addon" >&2; return 1; }
  done
  # The console parses the panel and drops a line it cannot read, so a typo
  # here is a light that quietly goes missing from the Panel page.
  while read -r name colour role label; do
    [ -n "${name}" ] || continue
    case "${colour}" in green|red|orange|amber|yellow|blue|white|rgb) ;; *)
      echo "${BOARD_ID}: PULZR_LEDS ${name}: unknown colour '${colour}'" >&2; return 1 ;;
    esac
    case "${role}" in power|status|cloud|lora|ethernet|wifi|cellular|bluetooth) ;; *)
      echo "${BOARD_ID}: PULZR_LEDS ${name}: unknown role '${role}'" >&2; return 1 ;;
    esac
    [ -n "${label}" ] || { echo "${BOARD_ID}: PULZR_LEDS ${name}: no label" >&2; return 1; }
    case "${name}${label}" in *"'"*)
      echo "${BOARD_ID}: PULZR_LEDS ${name}: a quote ends the value in /etc/pulzr/board.conf" >&2; return 1 ;;
    esac
  done <<EOF
${PULZR_LEDS}
EOF
  return 0
}

# Everything this board installs: the shared list, each feature's group, the
# board's own, then its built-in add-ons. Comments are left in; the callers
# strip them.
pulzr_packages() {
  local word var
  printf '%s\n' "${PACKAGES_COMMON}"
  for word in ${PULZR_FEATURES}; do
    var="PACKAGES_$(echo "${word}" | tr '[:lower:]' '[:upper:]')"
    eval "printf '%s\\n' \"\${${var}:-}\""
  done
  printf '%s\n' "${PACKAGES_BOARD:-}"
  printf '%s\n' "${PULZR_ADDONS_BUILTIN:-}"
}

# ─── Defaults every gateway boots with ──────────────────────────────────────
# These become UCI defaults under /etc/uci-defaults via pulzr-base. A board
# may override any of them.

# The system log, in KB of RAM. OpenWrt's 64 holds about an hour, and the
# customer issue being chased is usually older than that. pulzr-logs and
# Pulzar Cloud read it; a board with more RAM keeps more.
PULZR_LOG_SIZE="512"

# LAN: the address you reach the console on when you plug into it directly.
# 192.168.1.1 is avoided deliberately — a gateway dropped onto a site LAN that
# already uses that range should not fight the site router for it.
PULZR_LAN_IPADDR="192.168.61.1"
PULZR_LAN_NETMASK="255.255.255.0"

# ─── The ethernet port ──────────────────────────────────────────────────────
#
# One port, no role. It holds a DHCP lease, the fixed console address and a
# link-local address all at once, so it is the backhaul and the console port
# simultaneously and nothing has to be detected. The reasoning is in
# pulzr-base's 20-pulzr-network; docs/src/content/docs/access.md covers what it means for
# whoever is standing in front of the gateway.
#
# What it must never be is a way *in* from the site. The wan zone drops
# everything except tcp/22, 80 and 443 from 169.254.0.0/16 and the console
# subnet — ranges a routed network does not reach us from. Management arrives
# over the WireGuard management tunnel, outbound-initiated; see docs/src/content/docs/backhaul.md.
PULZR_PORT_IFACE="eth0"

# ─── LAN ports ──────────────────────────────────────────────────────────────
#
# Ports for devices this gateway serves: a router-class board's LAN ports, or a
# Pi's USB Ethernet adapter. Empty on a single-port board, which keeps the port
# above exactly as it is and never serves DHCP anywhere.
#
# Set, they form the devlan zone, which PulzarOS owns: DHCP and DNS from the
# gateway, NAT out whichever uplink the route metrics pick, and every client
# kept from the others, the console and the management tunnel. A client
# reaches Pulzar, NTP and DNS unless its policy says internet. See
# docs/src/content/docs/lan.md and pulzr-lan.
#
# A board that sets the ports also lists lan in PULZR_FEATURES, and adds
# the kernel module for any USB adapter to PACKAGES_BOARD.
#
# 192.168.64.0/24 follows the console's 61, the setup AP's 62 and the USB
# port's 63, for the same reason: a site's own network is unlikely to use it.
PULZR_LAN_PORTS=""
PULZR_DEVLAN_IPADDR="192.168.64.1"

# ─── Provisioning through the boot partition ────────────────────────────────
#
# The FAT boot partition is how an installer gets a credential. Every laptop
# can read and write it with only a card reader, and the card is in your hand
# at the moment you flash it.
#
#   pulzr-password.txt          you write it; it becomes the initial
#                                 password and is then deleted from the card.
#   pulzr-initial-password.txt  we write it; the generated password, so you
#                                 can read it by putting the card back. Removed
#                                 once the password has been changed.
#   pulzr-authorized-keys       you write it; installed as root's SSH key.
#
# NOT a fleet-wide default password. One published README would otherwise be
# root on every gateway we ship — which is exactly what the previous PulzarOS
# did with pulzr/pulzr. A per-unit secret on the card costs the installer
# the same effort and has none of that blast radius.
#
# All of it is refused once the gateway is adopted, the same rule the setup AP
# follows: as open as the unit has something to lose. Whoever holds the card
# already holds the device, so this grants nothing physical possession did not.
#
# Set to 0 on a board that should never be provisioned this way.
PULZR_BOOTPART_KEYS="1"

# The console address. Printed on the label, and the base of the /24 that the
# firewall admits. Unusual on purpose: it must not collide with the site.
# Cellular is the default backhaul on every board that has a modem.
PULZR_WAN_CELL_ENABLED="1"

# LoRaWAN region. US915 unless a board or a site says otherwise.
PULZR_LORA_REGION="US915"

# ─── Build status ───────────────────────────────────────────────────────────
#
#   supported             OpenWrt has a device profile for this board, so it
#                         builds from a stock ImageBuilder.
#   needs-device-support  it does not. The board file is complete and the
#                         design is real, but nothing can assemble an image
#                         until the device exists upstream.
#
# `--list` and `--all` skip anything that is not `supported`, so CI does not
# fail on a board nobody can build yet. Naming one explicitly still tries, and
# says exactly what is missing.
BOARD_STATUS="supported"

# ─── How firmware gets onto the board ───────────────────────────────────────
#
#   sdcard      the image is a whole-disk image written to removable media.
#               `./flash.sh` handles these end to end.
#   sysupgrade  the image is flashed by the running system, or from a
#               bootloader. Board-specific, and not something a generic script
#               should attempt — see the board's own notes.
#
# A Pi is the first kind; the RAK units are the second, which is why flash.sh
# refuses them rather than writing something plausible to the wrong place.
BOARD_INSTALL="sdcard"

# Which of the images built for this board flash.sh should offer by default.
#
# squashfs-factory, not ext4: squashfs gives the read-only rootfs plus overlay
# that OpenWrt's failsafe and `jffs2reset` depend on, and the reset button's
# factory-reset path is exactly that. An ext4 image has a writable rootfs and
# no overlay, so a factory reset has nothing to discard.
BOARD_IMAGE_PREFERENCE="squashfs-factory"

# ─── Concentrators ──────────────────────────────────────────────────────────
#
# A gateway has one or more concentrator SLOTS. A slot is one SX130x and the
# eight channels it carries, so an 8-channel gateway has one slot and a
# 16-channel gateway has two. Modelling it this way rather than as a single
# "which concentrator" value is what lets a RAK7289CV2 and a Pi with one HAT
# share every line of code.
#
# Two kinds of board:
#
#   KIT       a Pi. What is attached is unknown at build time and changes when
#             somebody swaps a HAT, so the slot is declared "auto": probe every
#             bus, and let an operator correct it from the console. There is
#             deliberately no preferred bus — SPI, USB and UART are all normal
#             on a Pi and none of them is the "real" one.
#
#   PRODUCT   a RAK unit, or a Pi CM carrier we build ourselves. The hardware
#             is soldered down and known, so each slot is declared explicitly.
#             Probing a question we already know the answer to only adds a way
#             to get it wrong, and on a product the wrong answer ships.
#
# Slot syntax, space-separated, one entry per slot:
#
#   auto                                 probe every bus for this slot
#   <bus>:<device>:<reset>[:<power>]     a fixed slot
#
#     bus     spi | usb | uart
#     device  the device node, or a USB path
#     reset   GPIO line for the SX130x reset, or "-" if the board does not
#             expose one. Nearly every "my concentrator is not detected"
#             report is this line missing or wrong.
#     power   optional GPIO gating the concentrator's supply
#
# Examples:
#   PULZR_CONCENTRATOR_SLOTS="auto"                                  # a Pi
#   PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17"                 # 8ch
#   PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17 spi:/dev/spidev1.0:18"  # 16ch
PULZR_CONCENTRATOR_SLOTS="auto"

# Whether the operator may change concentrator settings from the console.
# True on a kit, false on a product: on a RAK unit the hardware cannot change,
# so an editable bus setting is only ever a way to break a working gateway.
PULZR_CONCENTRATOR_CONFIGURABLE="1"

# May LoRaWAN uplinks go out over cellular when the wired uplink is down?
#
# Management always fails over — an unreachable gateway cannot be fixed
# remotely, so it is worth the data every time. Uplinks are a different
# question: their volume is set by how many devices are in range rather than
# by anything we decide, and a wired outage nobody notices for a week is a
# bill nobody budgeted for.
#
# Default 1, so every gateway keeps behaving as it does today. A site that
# would rather lose uplinks than pay for them sets pulzr.lorawan.allow_cellular
# to 0, per gateway, from the console. Note what 0 costs right now: uplinks
# are dropped while wired is down, not held — local buffering is the next
# piece of this. See pulzr-lora-route.
PULZR_LORA_ALLOW_CELLULAR="1"

# Hold uplinks locally when they cannot be sent, and replay them later.
#
# A local broker on the gateway queues what the bridge cannot deliver, so a
# wired outage is a delay rather than a hole in the data. It is what makes
# PULZR_LORA_ALLOW_CELLULAR="0" a trade instead of a loss.
#
# On by default since a customer's gateway lost a day of uplinks to a dead
# cellular session it never recovered from. It was off at first because it
# puts a broker in the middle of the one data path that works. It only runs
# where there is an SD card to keep the queue on (the RAK's slot, a Pi's boot
# card); without one, uplinks go straight out as before. Per gateway in
# pulzr.lorawan.buffer. See pulzr-lora-buffer.
PULZR_LORA_BUFFER="1"

# ─── Setup access ───────────────────────────────────────────────────────────
#
# The recovery path for a gateway that has no working backhaul AND whose
# ethernet port cannot conveniently be reached. OFF BY DEFAULT.
#
# Field setup does not use WiFi — the ethernet port covers it, and the usual
# install involves no local connection at all. This exists for the case those
# do not cover, and is switched on deliberately from the console or from
# Pulzar Cloud rather than coming up on its own, because an AP standing on a
# customer site is a radio we are responsible for and a second door to defend.
#
# When it is on: open while the gateway is unadopted (nothing to lose), WPA2
# with a per-unit key once it is adopted. See docs/src/content/docs/access.md.
PULZR_AP_ENABLED="0"
PULZR_AP_FALLBACK="0"
# How long unreachable before the radio comes up, and how long it stays.
PULZR_AP_FALLBACK_AFTER="900"
PULZR_AP_WINDOW="1800"

# The setup network, used only when the AP above is enabled. Separate from
# everything else and firewalled to reach the console and nothing more.
PULZR_SETUP_IPADDR="192.168.62.1"

# ─── GNSS ───────────────────────────────────────────────────────────────────
#
# A gateway reports its position to the network server, and a gateway with a
# real receiver also gives the packet forwarder GPS time and PPS — which is
# what fine timestamping needs.
#
#   auto    probe UART then USB for a receiver emitting NMEA.
#   none    this board has none; use the recorded reference coordinates.
#   <path>  a fixed device, for boards where it is soldered down.
#
# PULZR_GPS_DEV pins the device when PULZR_GPS is not "auto".
PULZR_GPS="auto"
PULZR_GPS_DEV=""
PULZR_GPS_BAUD="9600"

# ─── Bluetooth ──────────────────────────────────────────────────────────────
#
# The board's own Bluetooth radio, for the pulzr-ble add-on (docs/src/content/docs/bluetooth.md),
# which also runs a USB dongle on any board. Off on every unit until somebody
# turns it on from Pulzar Net or the console: most sites have no beacons, and
# the radio costs nothing only while it is off.
#
#   ""      no Bluetooth radio this build can drive.
#   uart    on the board's own UART, attached from userspace with hciattach.
#           OpenWrt's hci_uart has H4 but not Broadcom's protocol, so the
#           kernel cannot bring the chip up on its own.
#   usb     a dongle; btusb attaches it and there is nothing to do.
#
# PULZR_BT_UART is the port, PULZR_BT_CHIP hciattach's name for the part,
# PULZR_BT_BAUD the rate, and PULZR_BT_BOOT the config.txt lines the
# wiring needs, space-separated (none contains a space, and the generated
# board.conf is read a line at a time), applied by pulzr-boot-config only
# while Bluetooth is on. PULZR_BT_POWER is the chip's enable line, as
# <gpiochip label>:<line>, raised before attaching: with the kernel's own
# Bluetooth node off, nothing else powers the chip, and hciattach then times
# out talking to a part held in reset.
PULZR_BT=""
PULZR_BT_UART=""
PULZR_BT_CHIP=""
PULZR_BT_BAUD=""
PULZR_BT_BOOT=""
PULZR_BT_POWER=""

# ─── Terminal UI ────────────────────────────────────────────────────────────
#
# Every board has the TUI (pulzr-tui, in PACKAGES_COMMON): it is a few dozen
# kilobytes of ucode and a serial console is something every board has. What
# varies is where else it can run, and those are the two features below. A
# board takes a feature by adding its package group to PACKAGES_BOARD and
# setting its variables; a board without the hardware leaves both alone, and
# nothing for it is built into the image.

# ─── Display ────────────────────────────────────────────────────────────────
#
# The TUI on the board's own screen. pulzr-display starts it on the HDMI
# console when the firmware found a display at boot, and does nothing at all
# when it did not. No kernel modules: the console runs on the firmware
# framebuffer the kernel already has.
#
#   PULZR_DISPLAY        what the output is ("hdmi"), or "" for none
#   PULZR_DISPLAY_BOOT   config.txt lines, as for PULZR_BT_BOOT
PACKAGES_DISPLAY="pulzr-display"
PULZR_DISPLAY=""
PULZR_DISPLAY_BOOT=""

# ─── USB device port ────────────────────────────────────────────────────────
#
# The board's USB device port as a network interface and a serial port
# running the TUI, for a laptop with a cable and nothing else. Only a SoC with
# a USB *device* controller wired to a connector can do this — not one whose
# ports are all host ports, and not a board whose USB socket is a USB-to-serial
# bridge on its console UART. See pulzr-usb-gadget and docs/src/content/docs/access.md.
#
#   PULZR_USB_GADGET        the controller ("dwc2"), or "" for none
#   PULZR_USB_GADGET_BOOT   config.txt lines that hand it the port
#   PULZR_USB_IPADDR        the gateway's address on the cable
PACKAGES_USB_GADGET="
  pulzr-usb-gadget
  kmod-usb-dwc2 kmod-usb-lib-composite kmod-usb-gadget-ncm kmod-usb-gadget-serial
"
PULZR_USB_GADGET=""
PULZR_USB_GADGET_BOOT=""
# The third of the console's subnets: 61 is the ethernet port, 62 the setup AP.
PULZR_USB_IPADDR="192.168.63.1"

# ─── IO ─────────────────────────────────────────────────────────────────────
#
# Logical LED names, mapped to whatever the board actually has. The console and
# the LED daemon only ever speak in these names; the mapping is the board's
# problem. A board that lacks one simply omits it and nothing breaks.
#
#   power     on when the gateway is up
#   status    heartbeat; solid when something needs attention
#   lora      blinks on every uplink the concentrator hears
#   cloud     backhaul state — see pulzr-io for the blink codes
#   cellular  modem state
#
# Values are the name under /sys/class/leds. `ledctl -l` on a running board
# lists what it actually has, which is the only reliable way to fill this in.
PULZR_LED_POWER=""
PULZR_LED_STATUS=""
PULZR_LED_LORA=""
PULZR_LED_CLOUD=""
PULZR_LED_CELLULAR=""

# The panel: every light on the board that the SoC drives, one per line, in the
# order the panel has them. The console's Panel page lists these and nothing
# else; the logical names above say what pulzr-io shows on some of them.
#
#   <sysfs name> <colour> <role> <label>
#
#   sysfs name  the directory under /sys/class/leds, or rgb:<function> for one
#               RGB light the kernel splits into red:, green: and blue:<function>
#   colour      green red orange amber yellow blue white rgb
#   role        power status cloud lora ethernet wifi cellular bluetooth
#   label       what the panel prints beside it; the rest of the line
#
# Taken from the board's device tree, never guessed: a light listed here that
# the kernel does not have shows as missing, which is a board file to fix. A
# light hardwired to the supply or driven by a modem is left out, since nothing
# on the gateway can light it or read it. Empty when the panel is not known,
# and the console lists /sys/class/leds instead.
PULZR_LEDS=""

# The reset button, by the name the kernel gives it: the file procd runs in
# /etc/rc.button/. One short press reports status on the LEDs, four raise the
# setup AP, and a long press is a factory reset.
PULZR_BUTTON_RESET="reset"
# How long the reset button must be held for a factory reset, in seconds.
# Long enough that it cannot be done by accident with a paperclip in a pocket.
PULZR_BUTTON_RESET_HOLD="10"

# A second button where the board has one. Unused by default.
PULZR_BUTTON_USER=""

# The WireGuard management tunnel is wired-only. OFF BY DEFAULT for cellular
# on purpose, and it is not about the cost of a keepalive: a cellular gateway
# is already reachable, over its SIM's own 1NCE address, through the OpenVPN
# tunnel the cloud holds open into that CGNAT'd network. A second tunnel over the same SIM to reach
# the same box would be running two management paths where one already works,
# for nothing.
#
# Enrolment still happens regardless — cheap, and it means the tunnel is ready
# the instant ethernet actually shows up, with no round trip to enrol late.
# Only the routing is gated: `pulzr-wireguard-route` refuses cellular as an
# egress unless this is 1, so wg0 sits enrolled and unreachable on a
# cellular-only gateway until wired appears, at which point it takes over on
# its own. On a board with no modem this changes nothing either way — cellular
# is only ever tried when it is actually there. See docs/src/content/docs/backhaul.md and
# pulzr-wireguard-route.
PULZR_WIREGUARD_ENABLED="1"
PULZR_WIREGUARD_ALLOW_CELLULAR="0"

# The management platform's endpoints.
#
# One place, because the deployment has already moved once and will again. The
# gateway builds every claim and adoption URL from PULZR_NET_URL, the console
# API hands the same value to the UI, and nothing anywhere else spells out a
# host — so a move is this line, not a grep.
#
# app.pulzr.net since 4 Nov 2026. net.parkeze.com serves the same platform and
# keeps serving it for every gateway built before then, and every QR code they
# printed: an old image needs no upgrade. (Compat: the old hostname.)
PULZR_NET_URL="https://app.pulzr.net"

# The broker, used until adoption supplies one. A gateway that is adopted
# keeps the host it was given, so this is only the first-contact default.
# (Compat: mqtt.parkeze.com is the broker's original hostname and still answers.)
PULZR_MQTT_HOST="mqtt.parkeze.com"
PULZR_MQTT_PORT="8883"

# Hostname prefix; the board appends a short serial-derived suffix.
PULZR_HOSTNAME_PREFIX="pulzr"
