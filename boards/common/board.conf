# Shared board definition. Every board in boards/<id>/board.conf sources this
# first and then overrides only what is actually different about it.
#
# The point of this file is that adding a board should be a page of deltas, not
# a fork. If you find yourself copying more than ~20 lines out of here into a
# board, the thing you copied belongs here instead.

# ─── OpenWrt release ────────────────────────────────────────────────────────
# Pinned, not "latest". An image built today and an image built in six months
# must contain the same kernel unless somebody chose otherwise in a commit.
OPENWRT_VERSION="24.10.0"

# ─── Packages every Parkeze gateway has ─────────────────────────────────────
# LuCI is absent on purpose and its removal is asserted in PACKAGES_REMOVE
# below: the Parkeze console replaces it, and shipping both would mean two
# unrelated ways to change the same UCI state with two different auth models.
PACKAGES_COMMON="
  parkeze-base
  parkeze-console
  parkeze-concentrator
  parkeze-cellular
  parkeze-wireguard
  parkeze-adopt
  parkeze-io
  parkeze-ap

  ucode ucode-mod-fs ucode-mod-ubus ucode-mod-uci ucode-mod-math
  ucode-mod-digest ucode-mod-struct
  rpcd rpcd-mod-file rpcd-mod-iwinfo
  uhttpd uhttpd-mod-ucode

  ca-bundle ca-certificates
  openssh-sftp-server

  # mDNS, so the console answers at <hostname>.local on a directly-connected
  # laptop regardless of which role the ethernet port took. This is what makes
  # a wrong role guess a nuisance rather than a lockout.
  umdns

  # Cellular. ModemManager rather than uqmi: 24.10 ships no uqmi for any
  # architecture, and ModemManager is where OpenWrt's modem support went. It
  # costs about 4MB installed once glib and libqmi are counted, which is the
  # main thing to watch on a flash-constrained board.
  kmod-usb-net-qmi-wwan modemmanager
  usbutils pciutils
  jshn jsonfilter
  logd
  urngd

  # Concentrator access. spi-tools gives us spi-pipe, which is how
  # sx130x_probe reads the chip version register on a kit board without a
  # compiled helper. libgpiod supplies gpioset for the SX130x reset line; the
  # sysfs GPIO interface it replaces is deprecated upstream and absent on some
  # targets. The package is gpiod-tools, not libgpiod-utils — the latter does
  # not exist in 24.10.
  spi-tools gpiod-tools

  # The LoRa gateway itself: ChirpStack Concentratord and MQTT Forwarder, from
  # our own feed, packaged per architecture — see feed/chirpstack-gateway.
  chirpstack-gateway
"

# Explicitly torn out rather than merely not added. ImageBuilder profiles pull
# a default package set, and on several targets that set includes LuCI.
PACKAGES_REMOVE="
  luci luci-ssl luci-base luci-mod-admin-full luci-theme-bootstrap
  uhttpd-mod-lua
  dnsmasq
"
# dnsmasq goes because parkeze-base installs dnsmasq-full instead — we need
# the DHCP option handling and the ipset support that the -full build has.
PACKAGES_COMMON="${PACKAGES_COMMON} dnsmasq-full"

# ─── Defaults every gateway boots with ──────────────────────────────────────
# These become UCI defaults under /etc/uci-defaults via parkeze-base. A board
# may override any of them.

# LAN: the address you reach the console on when you plug into it directly.
# 192.168.1.1 is avoided deliberately — a gateway dropped onto a site LAN that
# already uses that range should not fight the site router for it.
PARKEZE_LAN_IPADDR="192.168.61.1"
PARKEZE_LAN_NETMASK="255.255.255.0"

# ─── The ethernet port ──────────────────────────────────────────────────────
#
# One port, no role. It holds a DHCP lease, the fixed console address and a
# link-local address all at once, so it is the backhaul and the console port
# simultaneously and nothing has to be detected. The reasoning is in
# parkeze-base's 20-parkeze-network; docs/access.md covers what it means for
# whoever is standing in front of the gateway.
#
# What it must never be is a way *in* from the site. The wan zone drops
# everything except tcp/22, 80 and 443 from 169.254.0.0/16 and the console
# subnet — ranges a routed network does not reach us from. Management arrives
# over the WireGuard management tunnel, outbound-initiated; see docs/backhaul.md.
PARKEZE_PORT_IFACE="eth0"

# ─── Provisioning through the boot partition ────────────────────────────────
#
# The FAT boot partition is how an installer gets a credential. Every laptop
# can read and write it with only a card reader, and the card is in your hand
# at the moment you flash it.
#
#   parkeze-password.txt          you write it; it becomes the initial
#                                 password and is then deleted from the card.
#   parkeze-initial-password.txt  we write it; the generated password, so you
#                                 can read it by putting the card back. Removed
#                                 once the password has been changed.
#   parkeze-authorized-keys       you write it; installed as root's SSH key.
#
# NOT a fleet-wide default password. One published README would otherwise be
# root on every gateway we ship — which is exactly what the previous ParkezeOS
# did with parkeze/parkeze. A per-unit secret on the card costs the installer
# the same effort and has none of that blast radius.
#
# All of it is refused once the gateway is adopted, the same rule the setup AP
# follows: as open as the unit has something to lose. Whoever holds the card
# already holds the device, so this grants nothing physical possession did not.
#
# Set to 0 on a board that should never be provisioned this way.
PARKEZE_BOOTPART_KEYS="1"

# The console address. Printed on the label, and the base of the /24 that the
# firewall admits. Unusual on purpose: it must not collide with the site.
# Cellular is the default backhaul on every board that has a modem.
PARKEZE_WAN_CELL_ENABLED="1"

# LoRaWAN region. US915 unless a board or a site says otherwise.
PARKEZE_LORA_REGION="US915"

# ─── Build status ───────────────────────────────────────────────────────────
#
#   supported             OpenWrt has a device profile for this board, so it
#                         builds from a stock ImageBuilder.
#   needs-device-support  it does not. The board file is complete and the
#                         design is real, but nothing can assemble an image
#                         until the device exists upstream.
#
# `--list` and `--all` skip anything that is not `supported`, so CI does not
# fail on a board nobody can build yet. Naming one explicitly still tries, and
# says exactly what is missing.
BOARD_STATUS="supported"

# ─── How firmware gets onto the board ───────────────────────────────────────
#
#   sdcard      the image is a whole-disk image written to removable media.
#               `./flash.sh` handles these end to end.
#   sysupgrade  the image is flashed by the running system, or from a
#               bootloader. Board-specific, and not something a generic script
#               should attempt — see the board's own notes.
#
# A Pi is the first kind; the RAK units are the second, which is why flash.sh
# refuses them rather than writing something plausible to the wrong place.
BOARD_INSTALL="sdcard"

# Which of the images built for this board flash.sh should offer by default.
#
# squashfs-factory, not ext4: squashfs gives the read-only rootfs plus overlay
# that OpenWrt's failsafe and `jffs2reset` depend on, and the reset button's
# factory-reset path is exactly that. An ext4 image has a writable rootfs and
# no overlay, so a factory reset has nothing to discard.
BOARD_IMAGE_PREFERENCE="squashfs-factory"

# ─── Concentrators ──────────────────────────────────────────────────────────
#
# A gateway has one or more concentrator SLOTS. A slot is one SX130x and the
# eight channels it carries, so an 8-channel gateway has one slot and a
# 16-channel gateway has two. Modelling it this way rather than as a single
# "which concentrator" value is what lets a RAK7289CV2 and a Pi with one HAT
# share every line of code.
#
# Two kinds of board:
#
#   KIT       a Pi. What is attached is unknown at build time and changes when
#             somebody swaps a HAT, so the slot is declared "auto": probe every
#             bus, and let an operator correct it from the console. There is
#             deliberately no preferred bus — SPI, USB and UART are all normal
#             on a Pi and none of them is the "real" one.
#
#   PRODUCT   a RAK unit, or a Pi CM carrier we build ourselves. The hardware
#             is soldered down and known, so each slot is declared explicitly.
#             Probing a question we already know the answer to only adds a way
#             to get it wrong, and on a product the wrong answer ships.
#
# Slot syntax, space-separated, one entry per slot:
#
#   auto                                 probe every bus for this slot
#   <bus>:<device>:<reset>[:<power>]     a fixed slot
#
#     bus     spi | usb | uart
#     device  the device node, or a USB path
#     reset   GPIO line for the SX130x reset, or "-" if the board does not
#             expose one. Nearly every "my concentrator is not detected"
#             report is this line missing or wrong.
#     power   optional GPIO gating the concentrator's supply
#
# Examples:
#   PARKEZE_CONCENTRATOR_SLOTS="auto"                                  # a Pi
#   PARKEZE_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17"                 # 8ch
#   PARKEZE_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17 spi:/dev/spidev1.0:18"  # 16ch
PARKEZE_CONCENTRATOR_SLOTS="auto"

# Whether the operator may change concentrator settings from the console.
# True on a kit, false on a product: on a RAK unit the hardware cannot change,
# so an editable bus setting is only ever a way to break a working gateway.
PARKEZE_CONCENTRATOR_CONFIGURABLE="1"

# ─── Setup access ───────────────────────────────────────────────────────────
#
# The recovery path for a gateway that has no working backhaul AND whose
# ethernet port cannot conveniently be reached. OFF BY DEFAULT.
#
# Field setup does not use WiFi — the ethernet port covers it, and the usual
# install involves no local connection at all. This exists for the case those
# do not cover, and is switched on deliberately from the console or from
# parkeze.net rather than coming up on its own, because an AP standing on a
# customer site is a radio we are responsible for and a second door to defend.
#
# When it is on: open while the gateway is unadopted (nothing to lose), WPA2
# with a per-unit key once it is adopted. See docs/access.md.
PARKEZE_AP_ENABLED="0"
PARKEZE_AP_FALLBACK="0"
# How long unreachable before the radio comes up, and how long it stays.
PARKEZE_AP_FALLBACK_AFTER="900"
PARKEZE_AP_WINDOW="1800"

# The setup network, used only when the AP above is enabled. Separate from
# everything else and firewalled to reach the console and nothing more.
PARKEZE_SETUP_IPADDR="192.168.62.1"

# ─── GNSS ───────────────────────────────────────────────────────────────────
#
# A gateway reports its position to the network server, and a gateway with a
# real receiver also gives the packet forwarder GPS time and PPS — which is
# what fine timestamping needs.
#
#   auto    probe UART then USB for a receiver emitting NMEA.
#   none    this board has none; use the recorded reference coordinates.
#   <path>  a fixed device, for boards where it is soldered down.
#
# PARKEZE_GPS_DEV pins the device when PARKEZE_GPS is not "auto".
PARKEZE_GPS="auto"
PARKEZE_GPS_DEV=""
PARKEZE_GPS_BAUD="9600"

# ─── IO ─────────────────────────────────────────────────────────────────────
#
# Logical LED names, mapped to whatever the board actually has. The console and
# the LED daemon only ever speak in these names; the mapping is the board's
# problem. A board that lacks one simply omits it and nothing breaks.
#
#   power     on when the gateway is up
#   status    heartbeat; solid when something needs attention
#   lora      blinks on every uplink the concentrator hears
#   cloud     backhaul state — see parkeze-io for the blink codes
#   cellular  modem state
#
# Values are the name under /sys/class/leds. `ledctl -l` on a running board
# lists what it actually has, which is the only reliable way to fill this in.
PARKEZE_LED_POWER=""
PARKEZE_LED_STATUS=""
PARKEZE_LED_LORA=""
PARKEZE_LED_CLOUD=""
PARKEZE_LED_CELLULAR=""

# The reset button, as a Linux input keycode name (see /etc/rc.button/).
# Short press reports status on the LEDs; a long press is a factory reset.
PARKEZE_BUTTON_RESET="reset"
# How long the reset button must be held for a factory reset, in seconds.
# Long enough that it cannot be done by accident with a paperclip in a pocket.
PARKEZE_BUTTON_RESET_HOLD="10"

# A second button where the board has one. Unused by default.
PARKEZE_BUTTON_USER=""

# The WireGuard management tunnel prefers the ethernet path and fails over to
# cellular when it drops. A keepalive every 25 seconds is negligible against a
# 1NCE SIM's allowance, and a gateway that goes dark the moment somebody
# unplugs a cable is a worse outcome than that cost. On a board with no modem
# this changes nothing — cellular is only ever used when it is actually
# there. See docs/backhaul.md and parkeze-wireguard-route.
PARKEZE_WIREGUARD_ENABLED="1"
PARKEZE_WIREGUARD_ALLOW_CELLULAR="1"

# The management platform's endpoints.
#
# One place, because the deployment has already moved once and will again. The
# gateway builds every claim and adoption URL from PARKEZE_NET_URL, the console
# API hands the same value to the UI, and nothing anywhere else spells out a
# host — so a move is this line, not a grep.
PARKEZE_NET_URL="https://net.parkeze.com"

# The broker, used until adoption supplies one. mqtt.parkeze.com is EMQX's
# ingress (EMQX/deploy/emqx-ingress.yaml); mqtt.parkeze.net never resolved.
PARKEZE_MQTT_HOST="mqtt.parkeze.com"
PARKEZE_MQTT_PORT="8883"

# Hostname prefix; the board appends a short serial-derived suffix.
PARKEZE_HOSTNAME_PREFIX="parkeze"
