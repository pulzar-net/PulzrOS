# What the RAK WisGate boards have in common.
#
# These are PRODUCTS, not kits. Every one of them has its concentrators
# soldered down, its LEDs wired to known GPIOs, and its buttons on known
# inputs. So nothing here is probed and nothing here is operator-editable:
# a bus setting you can change on a board whose bus cannot change is only ever
# a way to break a working gateway.
#
# ── THESE BOARDS CANNOT BE BUILT FROM UPSTREAM OPENWRT ─────────────────────
#
# Checked against every one of the 82 targets in 24.10: the only Rakwireless
# device profile upstream is `rakwireless_rak633`, an old WiFi module. Neither
# WisGate gateway has a device profile, a DTS, or a target — so a stock
# ImageBuilder has nothing to assemble and fails with
#
#   Profile "rakwireless_rak7268c" does not exist!
#
# RAK ship their own OpenWrt fork with board support in it. Getting these
# building means one of:
#
#   * upstream the device — DTS, target profile, image recipe — which is the
#     right long-term answer and is a real piece of work;
#   * build against RAK's fork instead of a stock ImageBuilder, which means a
#     second build path in this repo;
#   * or run ParkezeOS on a Pi CM carrier we control, which is where this was
#     heading anyway.
#
# Until then BOARD_STATUS keeps them out of `--all` and out of CI. The files
# stay because the design in them is real and load-bearing: the RAK7289CV2 is
# the two-concentrator case the whole slot model exists to serve, and losing it
# would let that abstraction quietly rot.

# ── VERIFY BEFORE YOU TRUST THIS FILE ──────────────────────────────────────
#
# RAK ships its own OpenWrt-based firmware, which means a stock unit will tell
# you all of this directly. On a factory gateway over SSH:
#
#     ubus call system board            # target, subtarget, board name
#     cat /proc/cpuinfo                 # SoC
#     ls /sys/class/leds/               # the real LED names for the map below
#     ls /dev/spidev*                   # how many concentrators, and where
#     cat /proc/device-tree/model
#
# The values here are written from RAK's published specifications and have not
# been checked against hardware. Treat every one as a hypothesis until a unit
# is on the bench; the LED names in particular are the kind of thing that is
# never what you would guess.

. "${BOARDS_DIR}/common/board.conf"

# After the common config, not before: that file defaults BOARD_STATUS to
# "supported", so setting it first just gets overwritten. It did.
BOARD_STATUS="needs-device-support"

# Both current WisGate Edge boards are MediaTek MT76x8-class. Confirm the
# subtarget per board — this is the single most likely thing here to be wrong,
# and building for the wrong one produces an image that will not boot.
OPENWRT_TARGET="ramips"
OPENWRT_SUBTARGET="mt76x8"
OPENWRT_ARCH="mipsel_24kc"

PACKAGES_RAK="
  kmod-spi-dev
  kmod-leds-gpio kmod-gpio-button-hotplug
  kmod-mt7603
  wpad-basic-mbedtls
"

# Fixed hardware: no probing, no operator override.
PARKEZE_CONCENTRATOR_CONFIGURABLE="0"
PARKEZE_CONCENTRATOR_PROBE_ORDER=""

# Flash is tight on these compared to a Pi. The console is ucode precisely so
# that this class of board can carry the same image content as a Pi 5; if
# something added to PACKAGES_COMMON does not fit here, it does not belong
# there.
PARKEZE_FLASH_CONSTRAINED="1"

# These have real front-panel LEDs, so every logical name has somewhere to go
# and parkeze-io does not have to fold states together the way it does on a Pi.
PARKEZE_LED_POWER="rak:green:power"
PARKEZE_LED_STATUS="rak:green:status"
PARKEZE_LED_LORA="rak:green:lora"
PARKEZE_LED_CLOUD="rak:green:cloud"
PARKEZE_LED_CELLULAR="rak:green:lte"

# These carry an integrated GNSS module. The device node is a guess like
# everything else in this file — `ls /dev/tty*` on a stock unit settles it, and
# detection confirms the receiver actually answers before trusting it.
PARKEZE_GPS="fixed"
PARKEZE_GPS_DEV="/dev/ttyS1"
PARKEZE_GPS_BAUD="9600"

# These have a WiFi radio, so the setup AP works. Left at the shared default.

PARKEZE_BUTTON_RESET="reset"
PARKEZE_BUTTON_RESET_HOLD="10"
