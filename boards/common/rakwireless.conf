# What the RAK WisGate boards have in common.
#
# These are PRODUCTS, not kits. Every one of them has its concentrators
# soldered down, its LEDs wired to known GPIOs, and its buttons on known
# inputs. So nothing here is probed and nothing here is operator-editable:
# a bus setting you can change on a board whose bus cannot change is only ever
# a way to break a working gateway.
#
# ── UPSTREAM OPENWRT HAS NO DEVICE FOR THESE ───────────────────────────────
#
# The only Rakwireless profile in OpenWrt, through 25.12, is
# `rakwireless_rak633`, an old WiFi module. So a WisGate board's device
# support — a DTS and an OpenWrt patch — goes in its own public
# Pulzr/openwrt-<model> repo, made from Pulzr/openwrt-device-template,
# whose releases publish an ImageBuilder with it added, and the board sets
# OPENWRT_IMAGEBUILDER_URL to that release. The template's README is the
# process; rak7268cv2 is the one that has been through it. A release is per
# OpenWrt version, so moving OPENWRT_VERSION means a new release of each of
# these first; docs/boards.md says what that takes.
#
# A board that has not been through it keeps BOARD_STATUS at the default
# below, which holds it out of `--all` and CI. Those files stay because the
# design in them is real: the RAK7289CV2 is the two-concentrator case the slot
# model exists to serve.

# ── VERIFY BEFORE YOU TRUST THIS FILE ──────────────────────────────────────
#
# RAK ships its own OpenWrt-based firmware, which means a stock unit will tell
# you all of this directly — scripts/harvest-device.sh collects it. By hand:
#
#     ubus call system board            # target, subtarget, board name
#     cat /proc/cpuinfo                 # SoC
#     ls /sys/class/leds/               # the real LED names for the map below
#     ls /dev/spidev*                   # how many concentrators, and where
#     cat /proc/device-tree/model
#
# The defaults below are written from RAK's published specifications. A board
# that has been harvested overrides them with what the hardware said. Treat every one as a hypothesis until a unit
# is on the bench; the LED names in particular are the kind of thing that is
# never what you would guess.

. "${BOARDS_DIR}/common/board.conf"

# After the common config, not before: that file defaults BOARD_STATUS to
# "supported", so setting it first just gets overwritten. It did.
BOARD_STATUS="needs-device-support"

# Not an SD card: these boot from soldered flash and are updated through
# the vendor's own upgrade path or from U-Boot. flash.sh refuses them
# rather than writing a whole-disk image somewhere it does not belong.
BOARD_INSTALL="sysupgrade"

# Both current WisGate Edge boards are MediaTek MT76x8-class. Confirm the
# subtarget per board — this is the single most likely thing here to be wrong,
# and building for the wrong one produces an image that will not boot.
OPENWRT_TARGET="ramips"
OPENWRT_SUBTARGET="mt76x8"
OPENWRT_ARCH="mipsel_24kc"

# kmod-i2c-mt7628: the bus the RAK7268's breathing light hangs off, named here
# rather than left to arrive as somebody else's dependency.
# kmod-ledtrig-oneshot: the LED script's 'flash' (one blink per uplink) uses the
# oneshot trigger, which the stock kernel builds as a module and this image
# did not include. Without it every uplink logged four sysfs errors.
#
# kmod-sdhci-mt7620: the SD slot on the side of the case, and the one part of
# the storage work that is about the SoC rather than the board - a Pi's card
# is on a different controller entirely, and on a Pi it is the boot disk
# rather than storage. Pulls kmod-sdhci and kmod-mmc behind it.
PACKAGES_RAK="
  kmod-spi-dev
  kmod-leds-gpio kmod-gpio-button-hotplug
  kmod-ledtrig-oneshot
  kmod-i2c-mt7628
  kmod-mt7603
  kmod-sdhci-mt7620
  parkeze-storage
"

# Fixed hardware: no probing, no operator override.
PARKEZE_CONCENTRATOR_CONFIGURABLE="0"
PARKEZE_CONCENTRATOR_PROBE_ORDER=""

# Flash is tight on these compared to a Pi. The console is ucode precisely so
# that this class of board can carry the same image content as a Pi 5; if
# something added to PACKAGES_COMMON does not fit here, it does not belong
# there.
PARKEZE_FLASH_CONSTRAINED="1"

# These have real front-panel LEDs, so every logical name has somewhere to go
# and parkeze-io does not have to fold states together the way it does on a Pi.
PARKEZE_LED_POWER="rak:green:power"
PARKEZE_LED_STATUS="rak:green:status"
PARKEZE_LED_LORA="rak:green:lora"
PARKEZE_LED_CLOUD="rak:green:cloud"
PARKEZE_LED_CELLULAR="rak:green:lte"

# These carry an integrated GNSS module. The device node is a guess like
# everything else in this file — `ls /dev/tty*` on a stock unit settles it, and
# detection confirms the receiver actually answers before trusting it.
PARKEZE_GPS="fixed"
PARKEZE_GPS_DEV="/dev/ttyS1"
PARKEZE_GPS_BAUD="9600"

# A LoRaWAN gateway with a modem and a radio, and its GNSS. Nothing of the
# router set: a RAK's one port is the uplink and the console, never a LAN.
PARKEZE_FEATURES="lorawan cellular wifi gnss"

# These have a WiFi radio, so the setup AP works. Left at the shared default.

# Neither terminal-UI feature. The USB-C socket labelled Console is a CH340
# USB-to-serial bridge on the SoC's console UART, at 57600 — so the TUI is
# there already, as the serial console, with nothing to add. It is not a USB
# port of the SoC: the MT7628 has one USB 2.0 host port (the LTE modem's) and
# no device controller at all, so it cannot present itself as a network
# interface whatever is plugged in. And there is no display output to drive.

PARKEZE_BUTTON_RESET="reset"
PARKEZE_BUTTON_RESET_HOLD="10"

# ── The power board ────────────────────────────────────────────────────────
#
# A WisGate Edge Pro reaches its power board's hardware watchdog and the RAK
# battery pack over Modbus RTU, through a CH340 on its internal USB hub.
# parkeze-rak-power feeds the one and reads the other; see docs/rak-power.md.
# RAK's hardware and RAK's protocol, so it lives here and not in the shared
# config: a gateway with real IO gets its own design.
#
#   PARKEZE_RAK_POWER_USB   the CH340's USB port path ("1-1.4"), "" for none.
#                           A path and never a ttyUSB number: the number is
#                           whichever USB-serial driver bound first.
#   PARKEZE_RAK_POWER_ID    its vid:pid, checked before the port is opened
#
# None by default: the Lite boards have no power board to talk to. A board
# that has one adds PACKAGES_RAK_POWER to PACKAGES_BOARD.
PACKAGES_RAK_POWER="parkeze-rak-power"
PARKEZE_RAK_POWER_USB=""
PARKEZE_RAK_POWER_ID=""
