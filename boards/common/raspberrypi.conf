# What every Raspberry Pi board has in common.
#
# A Pi is a KIT, not a product. The same image has to come up on a Pi 3 with a
# Seeed WM1302 on SPI, a Pi 4 with a RAK5146 on USB, and a Pi 5 with whatever
# was in the drawer. So nothing here assumes a concentrator, a bus, or a reset
# line — all of it is probed, and all of it is correctable from the console.
#
# When we build our own carrier around a Compute Module, that board will NOT
# source this file. It will declare its slots explicitly, the way the RAK
# boards do, because at that point the hardware is ours and known.

. "${BOARDS_DIR}/common/board.conf"

# A kit can carry an SX1301 card (RAK2245, iC880A); pulzr-concentrator-detect
# tells them apart.
PACKAGES_LORAWAN="${PACKAGES_LORAWAN} chirpstack-concentratord-sx1301"

OPENWRT_TARGET="bcm27xx"

# kmod-ledtrig-oneshot: the LED script's 'flash' (one blink per uplink) uses the
# oneshot trigger, which the stock kernel builds as a module and this image
# did not include. Without it every uplink logged four sysfs errors.
PACKAGES_PI="
  kmod-spi-bcm2835 kmod-spi-dev
  kmod-i2c-bcm2835 kmod-i2c-core
  kmod-usb-serial kmod-usb-serial-cp210x kmod-usb-serial-ftdi
  # The RAK5146 USB module's own STM32 presents as CDC-ACM, not one of the
  # bridge chips above — no /dev/ttyACM* without this, and concentratord
  # gets handed a com_path of nothing to open. See probe_usb() in
  # pulzr-concentrator-detect.
  kmod-usb-acm
  kmod-leds-gpio kmod-gpio-button-hotplug
  kmod-ledtrig-oneshot
  # hciattach, for the pulzr-ble add-on to attach the board's UART Bluetooth
  # chip: an add-on brings only its own package, never one from OpenWrt's feed.
  bluez-utils
  ${PACKAGES_DISPLAY}
  # Four USB host ports and no modem of its own: whatever cellular adapter
  # somebody plugs in is the cellular uplink.
  ${PACKAGES_USB_CELLULAR}
"

# HDMI on every model, through the firmware framebuffer. enable_tvout=0 is for
# the Pi 3, which otherwise drives composite TV-out whenever it finds no HDMI
# — a video encoder powered for a cable nobody plugged in, and a framebuffer
# that would make pulzr-display think a screen was attached. The Pi 4 and 5
# already default to it off.
# Every Pi has at least 1GB; a day of logs is a few MB.
PULZR_LOG_SIZE="2048"

# A kit: whatever HAT, receiver or dongle somebody fits, so all of it.
PULZR_FEATURES="lorawan cellular wifi gnss speedtest"

PULZR_DISPLAY="hdmi"
PULZR_DISPLAY_BOOT="enable_tvout=0"

# Bluetooth, on the mini UART. OpenWrt's distroconfig.txt turns the chip off
# on every Pi 3 and 4 (disable-bt) to give the PL011 back to the header pins,
# and PulzarOS relies on that: the PL011 is the console or the GNSS. So the
# chip moves to the mini UART rather than taking the PL011 back
# (miniuart-bt), which leaves the header exactly as it was.
#
# krnbt=off keeps the mini UART a plain tty. With it on, the kernel claims the
# port for a Bluetooth driver this OpenWrt does not build, and hciattach has
# nothing to open. 460800 is the mini UART's ceiling for this chip.
PULZR_BT="uart"
PULZR_BT_UART="/dev/ttyS0"
PULZR_BT_CHIP="bcm43xx"
PULZR_BT_BAUD="460800"
PULZR_BT_BOOT="enable_uart=1 dtoverlay=miniuart-bt dtparam=krnbt=off"
# BT_ON, line 0 of the firmware's GPIO expander on a Pi 3 and 4. Found on
# A Pi 3: untouched, hciattach timed out; raised, it attached.
PULZR_BT_POWER="raspberrypi-exp-gpio:0"

# Probe every bus. Deliberately no preferred order: SPI, USB and UART are all
# normal on a Pi and none of them is more "real" than the others. The probe
# order below is cheapest-first, which is about how long detection takes and
# not about which hardware we expect.
PULZR_CONCENTRATOR_SLOTS="auto"
PULZR_CONCENTRATOR_PROBE_ORDER="usb spi uart"
PULZR_CONCENTRATOR_CONFIGURABLE="1"

# Which SPI profile to probe with when nobody has picked one. Not "the only
# SPI part a Pi can have" — the console's hardware menu lists every profile
# this build ships, and picking one there is how a HAT that is not this
# default gets found. See pulzr-concentrator-detect and the profile
# catalogue's README for how a profile's own pins take over once selected.
PULZR_CONCENTRATOR_DEFAULT_PROFILE="sx1302_spi"

# The board's fallback pins — used only when the SPI profile being probed
# names none of its own (see pulzr-concentrator-detect and the profile
# catalogue's README). 17/18 is the RAK and Seeed convention, and the right
# board-wide guess for it: a Pi is far more often fitted with one of those
# than anything else, and it is *only* a guess for whichever HAT is fitted —
# the pins that actually matter live on the profile the console selects, not
# here. A HAT that needs different or additional lines, like Waveshare's
# SX1302 HAT (23/18, plus SX1261 and AD5338R lines this convention has none
# of), is picked from the console's hardware menu, which probes with that
# profile's own pins — not by changing this file.
#
# Kept overridable (${VAR:-default}, not a literal): pulzr-concentrator-
# detect and the packet forwarder pass a profile's own pins in through these
# same names for the one probe or reset that profile needs, and a plain
# assignment here — sourcing board.conf, as both of them do — would silently
# overwrite whatever the caller just set before it was ever read.
PULZR_SX130X_RESET_GPIO="${PULZR_SX130X_RESET_GPIO:-17}"
PULZR_SX130X_POWER_EN_GPIO="${PULZR_SX130X_POWER_EN_GPIO:-18}"
# Absent on the board-wide default on purpose: the RAK/Seeed convention this
# falls back to has neither line, and probing them anyway means driving pins
# on a HAT that never wired them, for no chip this fleet has that needs it.
PULZR_SX1261_RESET_GPIO="${PULZR_SX1261_RESET_GPIO:-}"
PULZR_AD5338R_RESET_GPIO="${PULZR_AD5338R_RESET_GPIO:-}"
PULZR_SPI_DEV="/dev/spidev0.0"
PULZR_UART_DEV="/dev/ttyAMA0"

# The Pi's own two LEDs. There is no third, so `cloud` and `cellular` have
# nowhere to go and are left unmapped — pulzr-io folds their state into the
# status LED's blink code rather than pretending the board has more lights
# than it does.
PULZR_LED_POWER="PWR"
PULZR_LED_STATUS="ACT"
PULZR_LED_LORA=""
PULZR_LED_CLOUD=""
PULZR_LED_CELLULAR=""
PULZR_LEDS="
  PWR red   power  PWR
  ACT green status ACT
"

# GNSS. On a Pi with an SPI concentrator HAT — the common build — the HAT's
# GNSS module is wired to the Pi's own UART, so that is probed first. On a Pi
# with a USB concentrator the receiver is usually a second tty on the same
# stick, which the probe finds on its USB pass.
#
# The one configuration that does not work is a UART *concentrator* plus UART
# GNSS: there is one serial port and the concentrator has it. pulzr-gps-detect
# refuses to claim a port a concentrator already holds rather than letting the
# two fight, and the GPS has to go on USB in that build.
PULZR_GPS="auto"

# The serial console and UART GNSS want the same pin.
#
# On a Pi the kernel console is ttyAMA0, and on an SPI concentrator HAT that is
# also where the HAT's GNSS module is wired. Probing it reconfigures the port
# to 9600 raw and kills the console — which is the one tool you have when a
# gateway will not boot. So detection skips the console port by default and
# GNSS on a HAT simply is not found.
#
# Set this to 1 on a board where GNSS matters more than a serial console. The
# console is the safer default because a gateway with no GPS still works.
PULZR_GPS_ALLOW_CONSOLE_UART="0"

# Who owns the Pi's UART: "console" or "gps".
#
# The default is the console, because a gateway with no GPS still works and one
# you cannot watch boot is hard to fix. A Waveshare SX1302 HAT wires its GNSS to
# those same pins, so a unit with one set to "gps" instead — per unit, in
# `pulzr.hardware.uart_role`, since nothing can detect which HAT is fitted and
# not every Pi 3 has the same one. pulzr-boot-config applies it.
PULZR_UART_ROLE="console"

# A bare Pi has no buttons. A HAT or a carrier may add one; if it does, the
# board file that knows about it sets these.
PULZR_BUTTON_RESET=""
PULZR_BUTTON_USER=""

# One USB port is realistically the cellular modem.
PULZR_WAN_CELL_ENABLED="1"
