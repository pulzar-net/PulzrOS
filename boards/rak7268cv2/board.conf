# RAK7268CV2 — WisGate Edge Lite 2 V2, 8-channel, with LTE.
#
# Verified against a stock unit (WisGateOS 2.2.16) on 2026-09-16 — the raw
# facts are in devices/rak7268cv2/. Internally it is a RAK636 module:
# MT7628AN, 32MB SPI NOR, one SX1302 + two SX1250s, Quectel EG95 on USB, and
# an SD card on the pins the other four ethernet ports would have used.
#
# OpenWrt has no device for it, so the device support lives in the
# public parkeze/openwrt-rak7268cv2 repo, whose releases publish an ImageBuilder
# with it added. Installed from U-Boot over TFTP; see
# devices/rak7268cv2/README.md.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7268cv2"
BOARD_NAME="RAK7268CV2 WisGate Edge Lite 2"
BOARD_STATUS="supported"
OPENWRT_PROFILE="rakwireless_rak7268cv2"
OPENWRT_IMAGEBUILDER_URL="https://github.com/parkeze/openwrt-rak7268cv2/releases/download/25.12.6-1"

# The device recipe already pulls in SPI, SD, I2C, USB and the modem drivers,
# and kmod-leds-aw2013 for the light on top, which only that ImageBuilder has.
# kmod-ledtrig-pattern is what makes the light breathe.
PACKAGES_BOARD="${PACKAGES_RAK} kmod-ledtrig-pattern"

# SX1302 on SPI chip-select 1 (CS0 is the flash), reset on GPIO 11 — read
# from the vendor's global_conf.json and sx1302_reset_lgw.sh. No power-enable
# line.
PARKEZE_CONCENTRATOR_SLOTS="spi:/dev/spidev0.1:11"

# What is soldered down, for concentratord: a RAK2287-class SX1302, which
# selects its TX gain table. Checked on hardware: concentratord 4.7.1 with this
# model and reset pin brings the part up over the half-duplex SPI.
PARKEZE_CONCENTRATOR_PART="sx1302_spi"
PARKEZE_CONCENTRATOR_MODEL="rak_2287"

# No GNSS: RAK's own hardware record for the unit has an empty gps section, and
# its forwarder config has no gps_tty_path.
PARKEZE_GPS="none"
PARKEZE_GPS_DEV=""

# Power is hardwired; the cloud light is the RGB one on top (red:status,
# green:status, blue:status from leds-aw2013). eth and wifi are driven by the
# kernel (01_leds). green:lora-2 (GPIO 14) is a second LoRa-side LED whose
# panel label on this board is unconfirmed — `parkeze-led --test` settles it.
PARKEZE_LED_POWER=""
PARKEZE_LED_STATUS=""
PARKEZE_LED_LORA="green:lora-1"
PARKEZE_LED_CLOUD="rgb:status"
PARKEZE_LED_CELLULAR=""

PARKEZE_WAN_CELL_ENABLED="1"
