# RAK7268V2 — WisGate Edge Lite 2 V2, 8-channel, no LTE.
#
# The RAK7268CV2 without its modem: the same RAK636 module (MT7628AN, 32MB
# SPI NOR) and the same radio. ChirpStack's OpenWrt feed (MIT, its
# chirpstack-concentratord-target-rak7268v2 package) drives it exactly as this
# repo drives the CV2 -- a RAK2287-class SX1302 on /dev/spidev0.1, reset on
# GPIO 11 -- and ChirpStack Gateway OS builds every RAK636 board from the one
# device profile. So this is the CV2's device support and image with the
# cellular side left out, not a port of its own.
#
# Not yet run on a V2 unit. The CV2's header has what was checked on its
# hardware; harvest a V2 (scripts/harvest-device.sh) before calling it
# supported in docs/src/content/docs/boards.md.
#
# Gateway OS also lists a second, optional slot: a RAK5148 2.4 GHz LoRa card
# on USB. PulzrOS has no 2.4 GHz plan, so it is not declared.

. "${BOARDS_DIR}/rak7268cv2/board.conf"

BOARD_ID="rak7268v2"
BOARD_NAME="RAK7268V2 WisGate Edge Lite 2"
PULZR_FEATURES="lorawan wifi"
PULZR_LED_CELLULAR=""
PULZR_WAN_CELL_ENABLED="0"
# No modem, so no cellular: the CV2's is built in, and there is no USB port
# free here for the add-on's.
PULZR_ADDONS_BUILTIN=""
