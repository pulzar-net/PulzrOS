# Raspberry Pi 4 B.
#
# Real USB 3 and a dedicated gigabit NIC, so any of the three buses is a fine
# pairing here. Detection treats them equally.

. "${BOARDS_DIR}/common/raspberrypi.conf"

BOARD_ID="rpi4"
BOARD_NAME="Raspberry Pi 4"
OPENWRT_SUBTARGET="bcm2711"
OPENWRT_PROFILE="rpi-4"
OPENWRT_ARCH="aarch64_cortex-a72"

PACKAGES_BOARD="
  ${PACKAGES_PI}
  ${PACKAGES_USB_GADGET}
  # kmod-usb3 pulls kmod-usb-xhci-hcd; there is no kmod-usb-xhci-pci.
  kmod-usb3
  # BCM43455 — cypress firmware plus the matching NVRAM.
  cypress-firmware-43455-sdio
  brcmfmac-nvram-43455-sdio
"

# A Pi 4's core clock scales too; holding its floor keeps the mini UART's
# baud rate where hciattach set it.
PARKEZE_BT_BOOT="${PARKEZE_BT_BOOT} core_freq_min=500"

# The USB-C power port is also the SoC's OTG port (dwc2), so a laptop can
# reach the console over it. It is the power input as well: see
# parkeze-usb-gadget's note on power before relying on it in the field.
# dr_mode=peripheral because the port has no ID pin to say which end it is.
PARKEZE_USB_GADGET="dwc2"
PARKEZE_USB_GADGET_BOOT="dtoverlay=dwc2,dr_mode=peripheral"
