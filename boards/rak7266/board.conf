# RAK7266 — WisGate Edge Pro, outdoor, 8-channel.
#
# ChirpStack Gateway OS builds it from the rakwireless_rak636 device profile
# and drives its radio with the RAK7268V2's concentrator package, so as far as
# Gateway OS knows it is the Lite 2 V2's radio in an outdoor enclosure: a
# RAK2287-class SX1302 on /dev/spidev0.1, reset on GPIO 11 (ChirpStack's
# OpenWrt feed, MIT).
#
# Needs device support: the enclosure is the Pro's, and its LEDs, buttons,
# power board and any modem are not the Lite's. Harvest a unit
# (scripts/harvest-device.sh); if its device tree matches the RAK7268CV2's,
# this becomes a delta on boards/rak7268v2 like that one.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7266"
BOARD_NAME="RAK7266 WisGate Edge Pro"
OPENWRT_PROFILE="rakwireless_rak7266"

PACKAGES_BOARD="${PACKAGES_RAK}"
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.1:11"
PULZR_CONCENTRATOR_PART="sx1302_spi"
PULZR_CONCENTRATOR_MODEL="rak_2287"
PULZR_FEATURES="lorawan wifi"
PULZR_WAN_CELL_ENABLED="0"
