# RAK7268C — WisGate Edge Lite 2, 8-channel, with LTE.
#
# One SX1302 on SPI. The "C" is the cellular variant; the non-C board is
# otherwise identical and would differ here only in PULZR_WAN_CELL_ENABLED.
#
# Unverified against hardware — see the header of common/rakwireless.conf for
# the four commands that settle every value in this file.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7268c"
BOARD_NAME="RAK7268C WisGate Edge Lite 2"
OPENWRT_PROFILE="rakwireless_rak7268c"

PACKAGES_BOARD="${PACKAGES_RAK}"

# One slot, eight channels.
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17"

PULZR_WAN_CELL_ENABLED="1"
