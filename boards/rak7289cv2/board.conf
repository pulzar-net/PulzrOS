# RAK7289CV2 — WisGate Edge Pro V2, 16-channel, with LTE.
#
# TWO concentrators, and that is the interesting thing about this board.
#
# Sixteen channels is not one concentrator with twice the channels; it is two
# eight-channel parts, each its own process. Concentratord drives one part per
# process, so this board runs two packet forwarders — see
# feed/pulzr-concentrator/files/etc/init.d/pulzr-packet-forwarder, which
# spawns one instance per slot, and docs/concentrators.md for how the two are
# presented upstream as a single gateway.
#
# This board is the reason the slot model exists. Everything else in the fleet
# happens to have one slot; treating that as the general case would have made
# this board a fork.
#
# ── The parts are on USB, not SPI ──────────────────────────────────────────
#
# Read from RAK's shipping firmware, which is authoritative for its own
# hardware (the ChirpStack Gateway OS RAK image and RAK's WisGateOS both drive
# this board): the Pro's two radios are RAK5146 (SX1303) mPCIe cards, and each
# presents to Linux as a USB CDC-ACM device — /dev/ttyACM0 and /dev/ttyACM1 —
# not as an SX130x on a SPI bus, where the RAK7268CV2 Lite has a single SX1302
# soldered to SPI CS1. So there is no SPI concentrator, and nothing for
# concentratord to reset (the RAK5146's own STM32 owns the SX1303's reset — see
# the note in pulzr-lora-config); the image carries kmod-usb-acm.
#
# The device support (a DTS and an OpenWrt patch) lives in openwrt/ beside
# this file, built into an ImageBuilder by scripts/device-imagebuilder.sh. It shares the RAK636 module, and its flash map, with the Lite, but
# not its control lines: RAK writes each unit's in a hardware descriptor in the
# factory partition (pulzr-hwdesc), and on this board the device tree exports
# them by name — modem-reset on GPIO 2 (the Lite's is 42), lora-reset (the
# first slot's card, GPIO 17) and gnss-reset (GPIO 16). See pulzr-hwline.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7289cv2"
BOARD_NAME="RAK7289CV2 WisGate Edge Pro"
OPENWRT_PROFILE="rakwireless_rak7289cv2"
OPENWRT_DEVICE_SUPPORT="rak7289cv2"

# kmod-usb-acm for the two USB concentrators, on top of the shared RAK set;
# the power board (below).
PACKAGES_BOARD="${PACKAGES_RAK} kmod-usb-acm ${PACKAGES_RAK_POWER}"

# Two USB slots, <bus>:<device>:<reset>. The devices are /dev/lora0 and
# /dev/lora1, which 20-pulzr-lora links by the hub port each slot is wired to
# (RAK's own mapping: 1-1.2 and 1-1.3), never by ttyACM number, which is
# whatever was free when the card enumerated. The reset is a line the device
# tree exports by name: a fitted card that has not enumerated gets one pulse of
# lora-reset before detection gives up on it. The second slot's line is not in
# any descriptor seen yet. A slot past the number of cards the unit was built
# with reads unfitted rather than absent, so a one-card unit is not `partial`.
PULZR_LORA_USB_PORTS="1-1.2:1.0 1-1.3:1.0"
PULZR_CONCENTRATOR_SLOTS="usb:/dev/lora0:lora-reset usb:/dev/lora1:-"

# RAK5146 USB. concentratord drives the SX1303 with its sx1302 chipset support;
# the profile's model selects the TX gain table.
PULZR_CONCENTRATOR_PART="sx1302_usb"
PULZR_CONCENTRATOR_MODEL="rak_5146"

# Checked by eye on the bench (2026-10-26): green:lora-1 (GPIO 15) is the
# panel's LoRa 1 and green:lora-2 (GPIO 14) its LoRa 2, one per radio. LAN and
# WLAN are the kernel's (01_leds). PWR is hardwired and LTE is the modem's own
# status light, so neither is ours to drive.
PULZR_LED_POWER=""
PULZR_LED_STATUS=""
PULZR_LED_LORA="green:lora-1"
PULZR_LED_LORA2="green:lora-2"
PULZR_LED_CLOUD=""
PULZR_LED_CELLULAR=""

PULZR_WAN_CELL_ENABLED="1"

# ── The power board: the watchdog that keeps the power on ─────────────────
#
# The Pro has a CH340 USB-serial bridge (1a86:7523) on its internal hub at
# port 1-1.4, and ChirpStack reaches the power board through it: Modbus RTU
# at 9600 8N1, slave 0xC8 a hardware watchdog and slave 0x6E the optional
# RAK battery pack. All of it is from ChirpStack's RAK support
# (chirpstack-gateway-utils src/rak/), the one known-working user of this
# bus, and from the dmesg in chirpstack-gateway-os#155, where a RAK7289V2
# shows `ch341 1-1.4:1.0: ch341-uart converter detected`.
#
# The watchdog is on the newer hardware revision of the RAK7289V2/CV2. On DC
# power, a unit whose OS does not feed it is cut off ten minutes after the last
# feed: RAK's support says it "fully reboots", the reporter in #155 saw it go
# off and stay off. RAK's WisGateOS has a daemon for it (spregread, named in
# RAK's instructions there for disabling it); PulzarOS feeds it from
# pulzr-rak-power, every two minutes. PoE units were not affected in that
# report.
#
# RAK's own WisGateOS 2.3.1 (RAK636 image) names 1-1.4:1.0 its RS485 port,
# /dev/ttyRS485, and drives this bus from spregread (libmodbus): battery at
# slave 110 from 0x6000, the watchdog with a timeout of 10.
#
# On the bench Pro (2026-10-26, PulzarOS 0.1.0, on PoE) the CH340 came up
# at 1-1.4 as /dev/ttyUSB4, the EG95 holding ttyUSB0-3 — so by path, as
# below. Nothing answered at 0xC8 or 0x6E at 9600 8N1, read or write, though
# its factory descriptor lists the watchdog (`hwwdg`) and no battery pack was
# fitted. So a silent watchdog is fed anyway and is not a fault: on PoE a
# board that has one may not answer. See docs/rak-power.md.
PULZR_RAK_POWER_USB="1-1.4"
PULZR_RAK_POWER_ID="1a86:7523"

# The Modbus edge daemon is in this image rather than an add-on: the Pro's
# power board and battery are already on a Modbus bus, so Modbus is part of
# what this gateway is. Its buses.toml starts empty, so it is idle until
# somebody configures a bus, and it must never be given the CH340 above,
# which pulzr-rak-power owns. Every other board, the RAK7268CV2 included, gets
# pulzr-edge only as an add-on (scripts/check-addons.sh).
PULZR_ADDONS_BUILTIN="pulzr-edge"

# Bench-confirmed on a single-radio unit (2026-09-30): the full PulzarOS
# 24.10.0-1 image boots as rakwireless,rak7289cv2 with the flash map this file
# describes; concentratord drives the SX1303 on /dev/ttyACM0 (8 channels,
# gateway ID read off the hardware), GNSS is on /dev/ttyS1, pulzr-led drives
# green:lora/green:lora1 (now lora-1/lora-2), and adoption issues a claim code. The absent second
# card (ttyACM1) is reported as the partial state, as designed.
#
# Marked supported on that basis: the two-slot structure is in place and ready
# for a dual-card Pro to light up slot 1.
#
# Open bench notes: the LTE modem enumerated unreliably (USB error -71/-32,
# marginal power); pulzr-led --list prints PHYSICAL "-" though control works
# (cosmetic); the packet forwarder needed a manual start on first boot.
BOARD_STATUS="supported"

# The u-blox on /dev/ttyS1 resets through gnss-reset (GPIO 16): one pulse
# before pulzr-gps-detect writes a silent receiver off.
PULZR_GPS_RESET="gnss-reset"
