# RAK7289CV2 — WisGate Edge Pro V2, 16-channel, with LTE.
#
# TWO SX1302s, and that is the interesting thing about this board.
#
# Sixteen channels is not one concentrator with twice the channels; it is two
# eight-channel parts on separate SPI buses. Semtech's HAL drives one part per
# process, so this board runs two packet forwarders — see
# feed/parkeze-concentrator/files/etc/init.d/parkeze-packet-forwarder, which
# spawns one instance per slot, and docs/concentrators.md for how the two are
# presented upstream as a single gateway.
#
# This board is the reason the slot model exists. Everything else in the fleet
# happens to have one slot; treating that as the general case would have made
# this board a fork.
#
# Unverified against hardware — see the header of common/rakwireless.conf.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7289cv2"
BOARD_NAME="RAK7289CV2 WisGate Edge Pro"
OPENWRT_PROFILE="rakwireless_rak7289cv2"

PACKAGES_BOARD="${PACKAGES_RAK}"

# Two slots, eight channels each. The second SPI bus and its reset line are the
# values most worth confirming on hardware: a wrong device node here yields a
# gateway that works perfectly on eight channels and silently never uses the
# other eight, which is a difficult thing to notice from uplink counts alone.
PARKEZE_CONCENTRATOR_SLOTS="spi:/dev/spidev0.0:17 spi:/dev/spidev1.0:18"

# A second LoRa LED, since this board has two radios and a single blinking
# light would say nothing about which half is working.
PARKEZE_LED_LORA="rak:green:lora"
PARKEZE_LED_LORA2="rak:green:lora2"

PARKEZE_WAN_CELL_ENABLED="1"
