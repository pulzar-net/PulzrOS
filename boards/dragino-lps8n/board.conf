# Dragino LPS8N indoor gateway, 8-channel.
#
# Atheros AR9331 (ath79/generic), 16MB flash, one Dragino PG1302 (SX1302) on
# bit-banged SPI, /dev/spidev1.0. Upstream OpenWrt has the older LPS8, not
# this one, so the device support is the public
# pulzar-net/openwrt-dragino-lps8n repo: ChirpStack Gateway OS's device tree
# (GPL-2.0-or-later OR MIT) ported to 25.12, whose release publishes an
# ImageBuilder with it added. The concentrator's reset is GPIO 23,
# concentratord's default for a PG1302, which ChirpStack's own LPS8N
# configuration relies on (its OpenWrt feed, MIT). Its ChirpStack binaries are
# the ones in ChirpStack Gateway OS for this board (feed/chirpstack-gateway).
#
# Needs device support until that repo's first release is out; then
# BOARD_STATUS goes to supported. Not yet run on a unit.

. "${BOARDS_DIR}/common/board.conf"

BOARD_ID="dragino-lps8n"
BOARD_NAME="Dragino LPS8N"
BOARD_STATUS="needs-device-support"
OPENWRT_IMAGEBUILDER_URL="https://github.com/pulzar-net/openwrt-dragino-lps8n/releases/download/25.12.6-1"
BOARD_INSTALL="sysupgrade"
OPENWRT_TARGET="ath79"
OPENWRT_SUBTARGET="generic"
OPENWRT_PROFILE="dragino_lps8n"
OPENWRT_ARCH="mips_24kc"

PACKAGES_BOARD="kmod-spi-dev"
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev1.0:23"
PULZR_CONCENTRATOR_CONFIGURABLE="0"
PULZR_CONCENTRATOR_PART="sx1302_spi"
PULZR_CONCENTRATOR_MODEL="dragino_pg1302"
PULZR_FEATURES="lorawan wifi"
PULZR_WAN_CELL_ENABLED="0"
