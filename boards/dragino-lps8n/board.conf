# Dragino LPS8N indoor gateway, 8-channel.
#
# Qualcomm Atheros, built by ChirpStack Gateway OS as ath79/generic with a
# dragino_lps8n device it patches into OpenWrt (upstream has none). Its radio,
# from ChirpStack's OpenWrt feed (MIT, chirpstack-concentratord-target-
# dragino-lps8n): a Dragino PG1302 (SX1302) on /dev/spidev1.0. The reset line
# is not in that config: the feed's init script for the board drives it, and
# which GPIO it is has to come off a unit.
#
# Needs device support: a device tree and image recipe in a public
# Pulzr/openwrt-dragino-lps8n repo, from Pulzr/openwrt-device-template, written
# from a harvested unit (scripts/harvest-device.sh). Gateway OS's patch for it
# carries no license, so it is a reference to read against, not a file to copy.

. "${BOARDS_DIR}/common/board.conf"

BOARD_ID="dragino-lps8n"
BOARD_NAME="Dragino LPS8N"
BOARD_STATUS="needs-device-support"
BOARD_INSTALL="sysupgrade"
OPENWRT_TARGET="ath79"
OPENWRT_SUBTARGET="generic"
OPENWRT_PROFILE="dragino_lps8n"
OPENWRT_ARCH="mips_24kc"

PACKAGES_BOARD="kmod-spi-dev"
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev1.0:-"
PULZR_CONCENTRATOR_CONFIGURABLE="0"
PULZR_CONCENTRATOR_PART="sx1302_spi"
PULZR_CONCENTRATOR_MODEL="dragino_pg1302"
PULZR_FEATURES="lorawan wifi"
PULZR_WAN_CELL_ENABLED="0"
