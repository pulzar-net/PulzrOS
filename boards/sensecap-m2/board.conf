# Seeed SenseCAP M2 Multi-Platform gateway, 8-channel.
#
# Its SenseCAP WM7628N module: MT7628 (ramips/mt76x8), 32MB flash, an SD card,
# and a Seeed WM1302 (SX1302) on /dev/spidev0.1 -- reset GPIO 14,
# power-enable GPIO 3, the SX1261's reset GPIO 15 (ChirpStack's OpenWrt feed,
# MIT; PulzrOS does not do listen-before-talk, so the SX1261 is left alone).
# Upstream OpenWrt has no device for it, so the device support is openwrt/
# beside this file: ChirpStack Gateway OS's device tree
# (GPL-2.0-or-later OR MIT) ported to 25.12, keeping the stock board name so
# the image is accepted from Seeed's firmware.
#
# Needs device support until that repo's first release is out; then
# BOARD_STATUS goes to supported. Not yet run on a unit.

. "${BOARDS_DIR}/common/board.conf"

BOARD_ID="sensecap-m2"
BOARD_NAME="SenseCAP M2"
BOARD_STATUS="needs-device-support"
BOARD_INSTALL="sysupgrade"
OPENWRT_TARGET="ramips"
OPENWRT_SUBTARGET="mt76x8"
OPENWRT_PROFILE="sensecap_wm7628n"
OPENWRT_DEVICE_SUPPORT="sensecap-m2"
OPENWRT_ARCH="mipsel_24kc"

PACKAGES_BOARD="kmod-spi-dev kmod-i2c-mt7628"
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.1:14:3"
PULZR_CONCENTRATOR_CONFIGURABLE="0"
PULZR_CONCENTRATOR_PART="sx1302_spi"
PULZR_CONCENTRATOR_MODEL="seeed_wm1302"
PULZR_FEATURES="lorawan wifi"
PULZR_WAN_CELL_ENABLED="0"

# From the device tree (openwrt/). None is mapped to a logical name, so pulzr-io
# drives none of them; the kernel's own triggers do.
PULZR_LEDS="
  green:lora green lora     LoRa
  green:wan  green ethernet WAN
  green:wlan green wifi     WLAN
"
