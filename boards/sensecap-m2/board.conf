# Seeed SenseCAP M2 Multi-Platform gateway, 8-channel.
#
# MT7628 (ChirpStack Gateway OS builds it as ramips/mt76x8 with its own
# sensecap_wm7628n device, which upstream OpenWrt does not have). Its radio,
# from ChirpStack's OpenWrt feed (MIT, chirpstack-concentratord-target-
# seeed-sensecap-m2): a Seeed WM1302 (SX1302) on /dev/spidev0.1, reset on
# GPIO 14, power-enable on GPIO 3, and the SX1261 listen-before-talk radio's
# reset on GPIO 15.
#
# Needs device support: a device tree and image recipe in a public
# Pulzr/openwrt-sensecap-m2 repo, from Pulzr/openwrt-device-template, written
# from a harvested unit. The SX1261 reset is not driven here: PulzarOS does
# not do listen-before-talk.

. "${BOARDS_DIR}/common/board.conf"

BOARD_ID="sensecap-m2"
BOARD_NAME="SenseCAP M2"
BOARD_STATUS="needs-device-support"
BOARD_INSTALL="sysupgrade"
OPENWRT_TARGET="ramips"
OPENWRT_SUBTARGET="mt76x8"
OPENWRT_PROFILE="seeed_sensecap-m2"
OPENWRT_ARCH="mipsel_24kc"

PACKAGES_BOARD="kmod-spi-dev kmod-i2c-mt7628"
PULZR_CONCENTRATOR_SLOTS="spi:/dev/spidev0.1:14:3"
PULZR_CONCENTRATOR_CONFIGURABLE="0"
PULZR_CONCENTRATOR_PART="sx1302_spi"
PULZR_CONCENTRATOR_MODEL="seeed_wm1302"
PULZR_FEATURES="lorawan wifi"
PULZR_WAN_CELL_ENABLED="0"
