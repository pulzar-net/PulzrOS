# Raspberry Pi 3 B / B+.
#
# Development and small-site board. No USB 3, and the USB controller is shared
# with the NIC — so a USB concentrator here competes with ethernet for
# bandwidth. That is worth knowing when siting one, but it is not a reason to
# refuse the configuration: it works, and it is what somebody will have on the
# bench. Detection treats every bus equally.

. "${BOARDS_DIR}/common/raspberrypi.conf"

BOARD_ID="rpi3"
BOARD_NAME="Raspberry Pi 3"
OPENWRT_SUBTARGET="bcm2710"
OPENWRT_PROFILE="rpi-3"
OPENWRT_ARCH="aarch64_cortex-a53"

PACKAGES_BOARD="
  ${PACKAGES_PI}
  # BCM43430. Firmware and NVRAM are separate packages, and the firmware for
  # this part ships in the cypress set — brcmfmac-firmware-43430-sdio does not
  # exist (the brcmfmac one is -43430a0-, for the older revision).
  cypress-firmware-43430-sdio
  brcmfmac-nvram-43430-sdio
"

# The mini UART's clock is the VPU core's, which a Pi 3 scales with load; the
# baud rate would drift with it. Fixed, as Raspberry Pi document for
# miniuart-bt on this model.
PARKEZE_BT_BOOT="${PARKEZE_BT_BOOT} core_freq=250"

# No USB device port. Every USB socket on a Pi 3 B/B+ hangs off the LAN95xx
# hub, so the SoC's controller can only ever be a host; the TUI is on the
# serial console and, with a screen at boot, on HDMI.
