# RAK7267 — WisGate Soho Pro, 8-channel, one RAK5146 on USB, GNSS.
#
# Another RAK636 board: ChirpStack Gateway OS builds it from the one
# rakwireless_rak636 device, and ChirpStack's OpenWrt feed (MIT,
# chirpstack-concentratord-target-rak7267) drives its radio as a rak_5146 on
# the first CDC-ACM port with GNSS, no reset line (the card's own STM32 owns
# the SX1303's reset, as on the RAK7289CV2). RAK636 is a module, so its LEDs,
# buttons and flash map are the module's; this is the RAK7289CV2's image (its
# USB concentrator support) with one card, no power board and no modem.
#
# One card means one CDC-ACM device, so the slot names /dev/ttyACM0 directly;
# the two-card Pro needs PULZR_LORA_USB_PORTS to tell its cards apart.
#
# Not yet run on a unit.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7267"
BOARD_NAME="RAK7267 WisGate Soho Pro"
BOARD_STATUS="supported"
OPENWRT_PROFILE="rakwireless_rak7289cv2"
OPENWRT_IMAGEBUILDER_URL="https://github.com/Pulzr/openwrt-rak7289cv2/releases/download/25.12.6-1"

PACKAGES_BOARD="${PACKAGES_RAK} kmod-usb-acm"
PULZR_CONCENTRATOR_SLOTS="usb:/dev/ttyACM0:-"
PULZR_CONCENTRATOR_PART="sx1302_usb"
PULZR_CONCENTRATOR_MODEL="rak_5146"

PULZR_FEATURES="lorawan wifi gnss"
PULZR_LED_POWER=""
PULZR_LED_STATUS=""
PULZR_LED_LORA="green:lora-1"
PULZR_LED_CLOUD=""
PULZR_LED_CELLULAR=""
PULZR_WAN_CELL_ENABLED="0"
