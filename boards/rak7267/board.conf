# RAK7267 — WisGate Soho Pro, 8-channel, one RAK5146 on USB, GNSS.
#
# Another RAK636 board (ChirpStack Gateway OS builds it from the same
# rakwireless_rak636 device profile as the Edge units). ChirpStack's OpenWrt
# feed (MIT, chirpstack-concentratord-target-rak7267) drives its radio as a
# rak_5146 on the first CDC-ACM port with GNSS through gpsd, and sets no reset
# line: the card's own STM32 owns the SX1303's reset, as on the RAK7289CV2.
#
# Needs device support: the RAK7289CV2's device tree exports its control lines
# by name, and which lines this board has, and which hub port its card is on,
# are not known without a unit (scripts/harvest-device.sh). With those, it is
# a Pulzr/openwrt-rak7267 release, or a variant of the RAK7289CV2's.

. "${BOARDS_DIR}/common/rakwireless.conf"

BOARD_ID="rak7267"
BOARD_NAME="RAK7267 WisGate Soho Pro"
OPENWRT_PROFILE="rakwireless_rak7267"

PACKAGES_BOARD="${PACKAGES_RAK} kmod-usb-acm"
PULZR_CONCENTRATOR_SLOTS="usb:/dev/lora0:-"
PULZR_CONCENTRATOR_PART="sx1302_usb"
PULZR_CONCENTRATOR_MODEL="rak_5146"
PULZR_FEATURES="lorawan wifi gnss"
PULZR_WAN_CELL_ENABLED="0"
