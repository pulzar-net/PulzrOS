# GL.iNet GL-SFT1200 (Opal): a router, not a LoRa gateway.
#
# The board a site's IP devices sit behind, on its two LAN ports; the first is
# an Arduino Opta PLC. One WAN port, a MaxLinear GSW150 switch, 128MB of SPI
# NAND, USB 2.0, 5V over USB-C. No LoRa radio, no GNSS, no Bluetooth.
#
# OpenWrt has no device for it, and its siflower/sf19a2890 target is
# source-only with a 6.12 kernel that has no GSW150 driver. The device support
# lives in parkeze/openwrt-gl-sft1200: 25.12.6 userland, so this board runs
# the same feed as every other, on siflower's 6.18 kernel with the switch.
# That repo's README is the hardware record and the harvest and recovery
# procedure. A unit has been harvested on GL's firmware; none has booted
# ParkezeOS yet.

. "${BOARDS_DIR}/common/board.conf"

BOARD_ID="gl-sft1200"
BOARD_NAME="GL.iNet GL-SFT1200 Opal"

# Held out of --all and CI until openwrt-gl-sft1200 has a 25.12.6-1 release.
BOARD_STATUS="needs-device-support"

# GL's U-Boot web recovery takes the factory image; after that, sysupgrade.
BOARD_INSTALL="sysupgrade"

OPENWRT_TARGET="siflower"
OPENWRT_SUBTARGET="sf19a2890"
OPENWRT_PROFILE="glinet_gl-sft1200"
# The FPU variant: interAptiv has one, and the release publishes userland for
# it. Not mipsel_24kc, which is why ChirpStack's soft-float MIPS binaries
# could not run here even if it had a radio.
OPENWRT_ARCH="mipsel_24kc_24kf"
OPENWRT_IMAGEBUILDER_URL="https://github.com/parkeze/openwrt-gl-sft1200/releases/download/25.12.6-1"

# The router set, and a USB modem as the second uplink. No lorawan, so no
# concentrator, ChirpStack or uplink broker in the image. No wifi: its radios
# have only Siflower's vendor driver, so there is nothing this image can raise.
PARKEZE_FEATURES="cellular lan dns failover"

# The ports as the device tree names them, after GL's own labels: lan1 is the
# jack at the end and lan2 the one beside WAN, checked by link state on a
# harvested unit. wan is the uplink; the two LAN ports are the devlan zone.
PARKEZE_PORT_IFACE="wan"
PARKEZE_LAN_PORTS="lan1 lan2"

PARKEZE_GPS="none"
PARKEZE_GPS_DEV=""

# The Opal's light is an ET6326 LED driver on I2C, which nothing drives yet.
PARKEZE_LED_POWER=""
PARKEZE_LED_STATUS=""
PARKEZE_LED_LORA=""
PARKEZE_LED_CLOUD=""
PARKEZE_LED_CELLULAR=""

PARKEZE_BUTTON_RESET="reset"
