# RAK7391 — WisGate Connect, a Raspberry Pi CM4 carrier.
#
# Two mPCIe slots that take whichever LoRa card was ordered: a RAK5146 on USB
# (the usual one), a RAK5146 or RAK2287 on SPI, or a RAK5148 2.4 GHz card. So
# unlike the WisGate Edge units the radio is not soldered down, and the slots
# are probed and operator-editable as on a kit. ChirpStack's OpenWrt feed
# (MIT, chirpstack-concentratord-target-rak7391) gives the card resets: GPIO 17
# for the first slot and GPIO 6 for the second -- the values to put in the
# console for an SPI card.
#
# The CM4 is a BCM2711, so this is the Pi 4 image and OpenWrt's own rpi-4
# profile (Gateway OS builds the carrier 32-bit, as rpi-2; nothing here needs
# that). Not yet run on a unit: the carrier's fan controller, RTC and PoE
# board are not driven.

. "${BOARDS_DIR}/rpi4/board.conf"

BOARD_ID="rak7391"
BOARD_NAME="RAK7391 WisGate Connect"

# Sold as a LoRaWAN gateway with its card fitted, so pulzr-lorawan is in the
# image, as on every RAK gateway; which card, and on which bus, is still
# probed.
PULZR_ADDONS_BUILTIN="pulzr-lorawan"

# The panel is the carrier's, not a Pi's, and its lights are not known: the
# console lists /sys/class/leds.
PULZR_LEDS=""
