# RAK7266 — WisGate Edge Pro (outdoor), 8-channel, no LTE.
#
# Another RAK636 board, and as far as its radio goes the RAK7268V2's: ChirpStack
# Gateway OS builds it from the one rakwireless_rak636 device and drives it
# with the RAK7268V2's concentrator package (ChirpStack's OpenWrt feed, MIT): a
# RAK2287-class SX1302 on /dev/spidev0.1, reset on GPIO 11. RAK636 is a module,
# so its LEDs, buttons and flash map are the module's whatever the enclosure;
# that is why one image serves every RAK636 board, and why this one is the
# RAK7268V2's with the Lite's breathing light left out.
#
# Not yet run on a unit.

. "$("${BOARDS_DIR}/common/board-dir" rak7268v2)/board.conf"

BOARD_ID="rak7266"
BOARD_NAME="RAK7266 WisGate Edge Pro"
# The breathing light is the Lite's, on top of its case.
PULZR_LED_CLOUD=""
