# Raspberry Pi 5.
#
# Two caveats worth knowing before you build one, neither of which changes the
# configuration here:
#
#   * OpenWrt's bcm2712 support is newer than the other two. Confirm the
#     profile name against the release you are pinned to before trusting a
#     build — `make info` in the ImageBuilder lists them.
#
#   * The Pi 5 moved GPIO behind the RP1 southbridge. The pin *numbers* are
#     unchanged, so the reset line is still 17 on a standard HAT, but the
#     gpiochip is not necessarily gpiochip0 any more. That is why
#     PARKEZE_GPIOCHIP exists and is set here — parkeze-sx130x-reset reads it,
#     and a wrong value looks exactly like a concentrator that is not plugged
#     in.

. "${BOARDS_DIR}/common/raspberrypi.conf"

BOARD_ID="rpi5"
BOARD_NAME="Raspberry Pi 5"
OPENWRT_SUBTARGET="bcm2712"
OPENWRT_PROFILE="rpi-5"
OPENWRT_ARCH="aarch64_cortex-a76"

PACKAGES_BOARD="
  ${PACKAGES_PI}
  # kmod-usb3 pulls kmod-usb-xhci-hcd; there is no kmod-usb-xhci-pci.
  kmod-usb3
  kmod-r8169
  # BCM43455, same part as the Pi 4.
  cypress-firmware-43455-sdio
  brcmfmac-nvram-43455-sdio
"

# The RP1's GPIO controller rather than the SoC's. Verify on hardware with
# `gpiodetect`; the console shows this field so it can be corrected without a
# rebuild.
PARKEZE_GPIOCHIP="gpiochip4"

# Pi 5's activity LED is on the RP1 too and is named differently from the
# earlier boards. Left unset rather than guessed wrong: an unmapped LED is
# inert, a wrongly-mapped one drives something else on the board.
PARKEZE_LED_POWER=""
PARKEZE_LED_STATUS="ACT"

