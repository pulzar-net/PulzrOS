name: Bug
description: Something on a gateway or in the build does not work.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: PULZR_VERSION in /etc/pulzr/board.conf, the console's Overview, or the image name.
      placeholder: 0.4.0-rc.9
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      description: The board ID from https://oss.pulzr.net/PulzrOS/hardware/, or "none" for the build, console or docs.
      placeholder: rpi4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from Logs in the console, or `logread`. Remove addresses, keys and site names.
      render: text
