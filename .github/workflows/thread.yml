# The Thread border router add-on against simulated radios: two border routers
# on OpenThread's otbr-agent at the commit the release's openthread-br pins, a
# device that joins by commissioning, and the device's parent stopped while it
# reports (scripts/test-thread.py). No hardware.
name: Thread

on:
  push:
    branches: [main]
    paths:
      - 'feed/pulzr-thread/**'
      - 'scripts/thread-sim.sh'
      - 'scripts/test-thread.py'
      - 'boards/common/board.conf'
      - '.github/workflows/thread.yml'
  workflow_dispatch:

concurrency:
  group: thread-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Two border routers, simulated
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ninja-build cmake socat jq libjson-c-dev

      # The commit OpenWrt pins moves only with OPENWRT_VERSION, so that and
      # this script key the cache.
      - uses: actions/cache@v4
        with:
          path: .build/thread-sim
          key: thread-sim-${{ hashFiles('boards/common/board.conf', 'scripts/thread-sim.sh') }}

      - name: Build otbr-agent and the simulation
        run: scripts/thread-sim.sh .build/thread-sim/out

      - name: Form, join, commission, fail over
        run: sudo -E python3 scripts/test-thread.py .build/thread-sim/out

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thread-sim-logs
          path: /tmp/thread-sim/
          retention-days: 7
