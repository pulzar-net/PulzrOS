# Build every board.
#
# ── SHAPE ──────────────────────────────────────────────────────────────────
#
#   check     lint and typecheck. Fast, and gates everything else.
#   console   build the React app ONCE.
#   feed      build the .ipk packages ONCE.
#   image     per-board matrix, consuming both of the above.
#   release   on a tag, collect every board's image.
#
# The point of splitting console and feed out is that neither depends on the
# board. Every package in feed/ is `Architecture: all` — interpreted shell,
# ucode and static files, no compile step — so one build genuinely serves all
# five boards. Building them inside the matrix instead meant five identical npm
# installs, five identical Vite builds and five identical package runs, which
# was most of the wall clock for none of the value.
#
# The ImageBuilder cache is keyed on target/subtarget rather than on board,
# because that is what the download actually is: the two RAK boards share one,
# so five boards need four downloads and the second RAK board is free.
#
# Runners are Linux, so none of the Docker machinery build.sh uses on a Mac is
# involved here — the runner is the Linux box.

name: build

on:
  push:
    branches: [main]
    # Tagging cuts a release with every board's image attached.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (space separated). Empty builds all.'
        required: false
        type: string

concurrency:
  # A new push supersedes an in-flight build of the same ref. Image builds are
  # minutes each across five boards; queueing them up serves nobody.
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place to change the Node version, rather than three.
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci
        working-directory: console

      - name: Typecheck the console
        working-directory: console
        run: npm run typecheck

      # ucode is not packaged for Ubuntu, so it is built — but only once ever,
      # since the cache key is the upstream commit this pins to.
      # The whole build directory, not just the binary: ucode links against
      # libucode.so.0 beside it and the native modules (fs.so, math.so) that
      # scripts/test-figlet.sh loads. Caching the binary alone produced a cache
      # hit that skipped the build and left an executable that could not start.
      - name: Cache ucode
        id: ucode-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ucode/build
          key: ucode-${{ runner.os }}-v2

      - name: Build ucode
        if: steps.ucode-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libjson-c-dev
          git clone --depth 1 https://github.com/jow-/ucode /tmp/ucode
          cmake -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release -DFS_SUPPORT=ON \
                -DMATH_SUPPORT=ON -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF \
                -DDIGEST_SUPPORT=OFF -DSTRUCT_SUPPORT=OFF -DNL80211_SUPPORT=OFF \
                -DRTNL_SUPPORT=OFF -DLOG_SUPPORT=OFF /tmp/ucode
          cmake --build /tmp/ucode/build -j"$(nproc)"

      - name: Check the ucode console API
        run: UCODE=/tmp/ucode/build/ucode scripts/check-ucode.sh

      # The upstream indexes are ~10MB and a pinned release never changes them.
      - name: Cache the upstream package indexes
        uses: actions/cache@v4
        with:
          path: .build/pkgindex
          key: pkgindex-${{ hashFiles('boards/**/board.conf') }}
          restore-keys: pkgindex-

      # Device scripts run under busybox ash. Checked with `sh -n` (dash on
      # Ubuntu, close enough to catch bashisms); build scripts as bash.
      - name: Check shell syntax
        run: |
          fail=0
          for f in build.sh scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done
          while IFS= read -r f; do
            # Shebang-aware: /usr/sbin also holds ucode programs, and feeding
            # one to `sh -n` reports a syntax error in perfectly good ucode.
            case "$(head -c 32 "$f")" in
              '#!'*ucode*) continue ;;
            esac
            sh -n "$f" || { echo "::error file=$f::POSIX sh syntax error"; fail=1; }
          done < <(find feed boards -type f \
                     \( -name '*.conf' -o -path '*/usr/sbin/*' \
                        -o -path '*/etc/init.d/*' -o -path '*/etc/uci-defaults/*' \
                        -o -path '*/hotplug.d/*' -o -path '*/rc.button/*' \
                        -o -path '*/profile.d/*' \))
          exit $fail

      - name: Check JSON
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done < <(find feed -name '*.json')
          exit $fail

      # A bash shebang would work on the build host and fail on a gateway,
      # where /bin/sh is busybox ash and bash is absent.
      - name: No bash in device scripts
        run: |
          # Only what ships: a package's files/. Build-host helpers beside it
          # (feed/*/fetch) run on the build machine and may be bash.
          if grep -rln '#!/bin/bash\|#!/usr/bin/env bash' feed/*/files/; then
            echo "::error::device scripts must be POSIX sh — OpenWrt ships ash, not bash"
            exit 1
          fi

      # Three packages that do not exist in 24.10 — figlet, libgpiod-utils and
      # uqmi — shipped at once, and the only symptom was five image jobs
      # failing after four minutes with the cause buried under a page of
      # "Configuring ...". This asks the release's own indexes instead, in
      # seconds, before anything is built.
      - name: Packages must exist upstream
        run: ./scripts/check-deps.sh

      # The wordmark renderer is a reimplementation of somebody else's format,
      # which is only trustworthy while it is checked against the original.
      - name: FIGlet renderer matches figlet
        run: |
          sudo apt-get install -y figlet
          UCODE=/tmp/ucode/build/ucode scripts/test-figlet.sh

      # OpenWrt's prepare_rootfs executes every uci-defaults script during
      # image assembly, with IPKG_INSTROOT set and absolute paths resolving to
      # the *build host*. An unguarded script there fails the image build at
      # best, and at worst bakes host state — or one shared password — into
      # every gateway flashed from that image. Both have happened; hence a
      # check rather than a comment.
      - name: uci-defaults must defer to first boot
        run: |
          fail=0
          while IFS= read -r f; do
            if ! grep -q 'IPKG_INSTROOT' "$f"; then
              echo "::error file=$f::missing the IPKG_INSTROOT guard"
              fail=1
              continue
            fi
            guard=$(grep -n 'IPKG_INSTROOT' "$f" | head -1 | cut -d: -f1)
            first=$(grep -nvE '^\s*#|^\s*$' "$f" | grep -v '^1:#!' | head -1 | cut -d: -f1)
            if [ "$guard" -gt "$first" ]; then
              echo "::error file=$f,line=$first::code runs before the IPKG_INSTROOT guard"
              fail=1
            fi
          done < <(find feed -path '*/etc/uci-defaults/*' -type f)
          exit $fail

  # ───────────────────────────────────────────────────────────────────────
  console:
    name: Console
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build
        run: ./build.sh --stage console

      # The built app, for the feed job to package. Not the whole repo — just
      # what the console stage produced.
      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: feed/parkeze-console/files/www
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  feed:
    name: Packages
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: console
          path: feed/parkeze-console/files/www

      # The recovery PUBLIC key. Without it images still build, but cannot be
      # adopted offline — build.sh warns rather than failing, which is right
      # for a fork or a PR from somebody without the secret.
      - name: Install the fleet recovery anchor
        env:
          RECOVERY_PUBKEY: ${{ secrets.PARKEZE_RECOVERY_PUBKEY }}
        run: |
          if [ -n "${RECOVERY_PUBKEY}" ]; then
            printf '%s\n' "${RECOVERY_PUBKEY}" > "${RUNNER_TEMP}/recovery.pub"
            echo "PARKEZE_RECOVERY_PUBKEY=${RUNNER_TEMP}/recovery.pub" >> "$GITHUB_ENV"
          else
            echo "::warning::No PARKEZE_RECOVERY_PUBKEY secret — images cannot be adopted offline."
          fi

      # unsquashfs: the MIPS ChirpStack binaries are extracted from
      # ChirpStack Gateway OS; see feed/chirpstack-gateway/fetch.
      - name: Build the package feed
        run: |
          sudo apt-get install -y squashfs-tools
          ./build.sh --stage feed

      # Both halves of the overlay travel together: the .ipk repository, and
      # the recovery key that install_fleet_key dropped into the board files.
      - uses: actions/upload-artifact@v4
        with:
          name: feed
          path: |
            .build/packages
            boards/common/files
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  boards:
    name: Discover boards
    needs: check
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          # Through the environment rather than interpolated into the script: a
          # workflow_dispatch input is arbitrary text, and pasting it into a
          # shell line is a command injection waiting for a backtick.
          REQUESTED: ${{ inputs.boards }}
        run: |
          # Each entry carries its target and subtarget, so the image job can
          # key its ImageBuilder cache on the download rather than on the board.
          # --list-json reports every board including the ones with no upstream
          # device support; the matrix takes only what can actually be built,
          # so a board waiting on a DTS does not turn the run red.
          all="$(./build.sh --list-json | jq -c '[.[] | select(.status == "supported")]')"
          held="$(./build.sh --list-json | jq -r '.[] | select(.status != "supported") | "  \(.board): \(.status)"')"
          if [ -n "${held}" ]; then
            echo "Not built (no upstream device profile):"
            echo "${held}"
            { echo "### Boards held back"; echo; echo '```'; echo "${held}"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${REQUESTED}" ]; then
            wanted="$(printf '%s' "${REQUESTED}" | tr ' ' '\n' \
                      | grep -v '^[[:space:]]*$' | jq -R . | jq -sc .)"
            matrix="$(jq -c --argjson w "${wanted}" \
                       '[.[] | select(.board as $b | $w | index($b))]' <<<"${all}")"
          else
            matrix="${all}"
          fi

          [ "$(jq 'length' <<<"${matrix}")" -gt 0 ] \
            || { echo "::error::no boards matched"; exit 1; }

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.board)  \(.target)/\(.subtarget)"' <<<"${matrix}"

  # ───────────────────────────────────────────────────────────────────────
  image:
    name: ${{ matrix.board }}
    needs: [feed, boards]
    runs-on: ubuntu-latest
    strategy:
      # One board failing should not hide whether the others build — a broken
      # RAK profile must not mask a working Pi image.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: console
          path: feed/parkeze-console/files/www

      - uses: actions/download-artifact@v4
        with:
          name: feed

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zstd unzip \
                                  file wget python3 rsync

      # Keyed on the ImageBuilder itself — version, target, subtarget, and where
      # it comes from — not on the board, so boards sharing a download share a
      # cache entry.
      - name: Cache the ImageBuilder
        uses: actions/cache@v4
        with:
          path: .build/imagebuilder
          key: imagebuilder-${{ matrix.imagebuilder }}

      - name: Assemble ${{ matrix.board }}
        run: ./build.sh --stage image "${{ matrix.board }}"

      # ImageBuilder failures are often a package that will not resolve, and
      # the useful line scrolls past in a wall of "Configuring ...". Surface it.
      - name: Explain a failure
        if: failure()
        run: |
          echo "### ${{ matrix.board }} failed" >> "$GITHUB_STEP_SUMMARY"
          log=".build/imagebuilder/${{ matrix.imagebuilder }}/logs/package/install.txt"
          if [ -f "$log" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Packages requested:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls .build/packages/*.ipk 2>/dev/null | xargs -n1 basename >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ImageBuilder's filenames say everything except which file to write to a
      # card. This renames the right one, produces the .img.xz Pi Imager wants,
      # and emits that board's entry for the OS list.
      - name: Package for humans
        run: ./scripts/package-images.sh "${{ matrix.board }}" "$(cat VERSION)"

      - name: Summarise
        run: |
          {
            echo "### ${{ matrix.board }} · ${{ matrix.target }}/${{ matrix.subtarget }}"
            echo
            echo '| Image | Size |'
            echo '|---|---|'
            find out/release -maxdepth 1 -type f \
                 \( -name "*${{ matrix.board }}*.img.gz" -o -name "*${{ matrix.board }}*.img.xz" \
                    -o -name "*${{ matrix.board }}*.bin" \) \
                 -printf '| `%f` | %s bytes |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # The friendly build: one image to write, one to upgrade with, checksums,
      # and the OS list fragment. Not the raw ImageBuilder output, which is
      # four cryptic files nobody can choose between.
      - uses: actions/upload-artifact@v4
        with:
          name: parkezeos-${{ matrix.board }}
          path: out/release/*
          # Long enough to flash a unit next week, short enough that the
          # storage quota is not spent on every push to a branch.
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parkezeos-*
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.img.gz' -o -name '*.img.xz' -o -name '*.bin' \) \
               -exec cp {} release/ \;
          ( cd release && sha256sum ./* > sha256sums.txt )
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
