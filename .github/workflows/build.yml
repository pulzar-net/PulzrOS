# Build every board.
#
# ── SHAPE ──────────────────────────────────────────────────────────────────
#
#   check     lint and typecheck, beside the build rather than before it; it
#             gates what leaves the run (the add-ons' publish, the release).
#   console   build the React app ONCE.
#   feed      stage the noarch packages ONCE.
#   image     per-board matrix: restores its own target's SDK packages and
#             device ImageBuilder (prebuilt.yml builds them), stages its own
#             architecture's packages, assembles. No board waits on another
#             target, and one whose prebuilt is missing waits alone.
#   addons    pack the add-ons into a signed apk repository; on a tag, publish
#             it. Needs every architecture, so it collects (prebuilt,
#             prebuilt-devices); no image waits on it.
#   release   on a tag, collect every board's image; refuses a missing one.
#
# The hours-long builds, the SDK packages and the device ImageBuilders, are
# not here: prebuilt.yml runs them in concurrency groups that never cancel, so
# a push that supersedes this run costs minutes, not a cold build.
#
# The point of splitting console and feed out is that neither depends on the
# board. Nearly every package in feed/ is noarch — interpreted shell, ucode and
# static files, no compile step — so one build genuinely serves all five
# boards; ChirpStack's binaries are staged once per architecture. The image
# job packs them into .apk files with its own ImageBuilder's apk, which is the
# only apk that writes this release's format (scripts/build-feed.sh). Building them inside the matrix instead meant five identical npm
# installs, five identical Vite builds and five identical package runs, which
# was most of the wall clock for none of the value.
#
# The ImageBuilder cache is keyed on target/subtarget rather than on board,
# because that is what the download actually is: the two RAK boards share one,
# so five boards need four downloads and the second RAK board is free.
#
# Runners are Linux, so none of the Docker machinery build.sh uses on a Mac is
# involved here — the runner is the Linux box.
#
# ── HANDING FILES BETWEEN JOBS ─────────────────────────────────────────────
#
# On GitHub's runners every job is a fresh machine, so the console, the feed
# and each board's images travel as artifacts. On the self-hosted runner every
# job is the same machine, and artifacts are a round trip to GitHub's storage
# for files that never had to leave the disk — and that storage has a quota,
# which, once spent, failed every build at its first upload. So there they go
# through $HANDOFF/<run id> instead. Keyed by run id, not attempt, so a rerun
# of a failed job finds what the jobs before it left. The runner's
# job-completed hook (runner-cleanup.sh on the VM), which empties everything
# else a job leaves, keeps this directory and deletes runs older than two days.

name: build

on:
  push:
    branches: [main]
    # Tagging cuts a release with every board's image attached.
    tags: ['v*']
    # A push that only touches the docs site or the repository's own Markdown
    # (README, CONTRIBUTING, ...) builds no firmware: a docs push cancelled
    # the hours-long build three times on 20 Nov 2026. docs.yml builds those.
    # Root *.md only, not **.md: feed/*/files/ ship READMEs in the image.
    # Path filters are never applied to tag pushes, so a release tag always
    # builds everything; pull_request keeps no filter.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Boards to build (space separated). Empty builds all.'
        required: false
        type: string

concurrency:
  # A new push supersedes an in-flight build of the same ref. Everything here
  # is minutes (the hours are prebuilt.yml's, which never cancels), and
  # queueing superseded builds up serves nobody.
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place to change the Node version, rather than three.
  NODE_VERSION: '22'
  HANDOFF: /var/lib/runner-handoff

jobs:
  # ───────────────────────────────────────────────────────────────────────
  check:
    name: Checks
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Pulzr Cloud offers a release to a gateway when the release's version
      # is newer than the one the gateway reports, and a gateway reports
      # VERSION — not the tag. Tag v0.3.0 on a tree whose VERSION still says
      # 0.2.0 and every gateway that installs it goes on reporting 0.2.0 and
      # is offered the same update forever. Refused here, before an hour of
      # image builds.
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${want}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${want#v}). Bump VERSION and tag ${want}, or retag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci
        working-directory: console

      - name: Typecheck the console
        working-directory: console
        run: npm run typecheck

      # ucode is not packaged for Ubuntu, so it is built — but only once ever,
      # since the cache key is the upstream commit this pins to.
      # The whole build directory, not just the binary: ucode links against
      # libucode.so.0 beside it and the native modules (fs.so, math.so) that
      # scripts/test-figlet.sh loads. Caching the binary alone produced a cache
      # hit that skipped the build and left an executable that could not start.
      - name: Cache ucode
        id: ucode-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ucode/build
          key: ucode-${{ runner.os }}-v2

      - name: Build ucode
        if: steps.ucode-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libjson-c-dev
          # A self-hosted runner keeps /tmp between jobs, and the clone refuses
          # a directory an earlier run left behind.
          rm -rf /tmp/ucode
          git clone --depth 1 https://github.com/jow-/ucode /tmp/ucode
          cmake -B /tmp/ucode/build -DCMAKE_BUILD_TYPE=Release -DFS_SUPPORT=ON \
                -DMATH_SUPPORT=ON -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF \
                -DDIGEST_SUPPORT=OFF -DSTRUCT_SUPPORT=OFF -DNL80211_SUPPORT=OFF \
                -DRTNL_SUPPORT=OFF -DLOG_SUPPORT=OFF /tmp/ucode
          cmake --build /tmp/ucode/build -j"$(nproc)"

      - name: Check the ucode console API
        run: UCODE=/tmp/ucode/build/ucode scripts/check-ucode.sh

      - name: Check printf arguments match their formats
        run: ./scripts/check-printf.sh

      - name: Check no script calls a command the image lacks
        run: ./scripts/check-commands.sh

      # The add-on repository's inputs: that no image but the RAK7289CV2's
      # carries Modbus, and that every board's architecture has an add-on build.
      - name: Check add-ons
        run: ./scripts/check-addons.sh

      # The claim's revocation path and sshd's trust: shell that otherwise
      # only runs on a gateway, against stubs for everything it calls.
      - name: Claim, SSH setup and cellular watchdog logic
        run: |
          ./scripts/test-claim.sh
          ./scripts/test-report-stats.sh
          ./scripts/test-apply.sh
          ./scripts/test-ssh-setup.sh
          ./scripts/test-cellular-watchdog.sh
          ./scripts/test-firmware-stash.sh
          ./scripts/test-firmware-handoff.sh
          ./scripts/test-legacy.sh
          ./scripts/test-usb-radios.sh
          ./scripts/test-ble-config.sh
          ./scripts/test-lan-push.sh
          ./scripts/test-logship.sh

      # The reset button, the setup AP and which uplinks count: shell that
      # otherwise only runs on a gateway, behind a physical button.
      - name: Reset button and setup mode
        run: ./scripts/test-setup-mode.sh

      # The RAK hardware descriptor (never letting its passwords out), the
      # named reset lines, and /dev/lora<n> following a card across resets.
      - name: Hardware descriptor and lines
        run: ./scripts/test-hwdesc.sh

      # pulzr-rak-power against a fake bus and a simulated power board. The
      # watchdog it feeds is what keeps a DC-powered RAK7289CV2 on, and no
      # bench unit has answered on that bus to catch a wrong frame.
      - name: RAK power board
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev libmodbus-dev python3-venv pkg-config
          ./scripts/test-rak-power.sh

      # The RAK7268's light breathes in hardware, in software or not at all
      # depending on the kernel; each is checked against a fake sysfs.
      - name: LED script
        run: ./scripts/test-led.sh

      # Failover moves a site's traffic between uplinks, and the case it
      # exists for, a cable that keeps its link while the internet behind it
      # is gone, is one no bench reproduces on demand. pulzr-uplinks and
      # pulzr-dns run against a JSON uci and a fake netifd and ping.
      - name: Uplinks and DNS
        run: UCODE=/tmp/ucode/build/ucode scripts/test-router.sh

      # The WiFi uplink's verdict, its resolver and roam(): one blocked host or
      # one lost DNS datagram used to read as offline, and a join used to be
      # undone by roam() within the minute. Against a fake netifd, curl, DNS
      # and iwinfo.
      - name: WiFi uplink and roaming
        run: UCODE=/tmp/ucode/build/ucode scripts/test-wifi-uplink.sh

      # A speed test of one connection from the Backhaul page: out of that
      # uplink's own device, no route touched, and cellular only once its
      # cost is confirmed.
      - name: Speed test of one uplink
        run: UCODE=/tmp/ucode/build/ucode scripts/test-speedtest.sh

      # The radios page: what each radio runs and what the hardware lets it
      # run. A repeater the radio cannot hold, a channel the regulatory domain
      # closes or an open AP onto the LAN are refused before anything is
      # written, and a WiFi join keeps the APs made there. Against `iw phy
      # info` from three kinds of radio, a fake netifd and iwinfo.
      - name: WiFi radios
        run: UCODE=/tmp/ucode/build/ucode scripts/test-radios.sh

      # Whether a signed image is an upgrade or a downgrade only staff may
      # make: dotted release candidates (rc.9), the undotted ones before them
      # (rc8) and the releases they lead to, in semver's order.
      - name: Release ordering
        run: UCODE=/tmp/ucode/build/ucode scripts/test-firmware-versions.sh

      # pulzr-addon puts root code on gateways nobody can reach, and is the
      # gateway's half of a denied capability staying off. Each refusal, a
      # download cut off half way, the gate's revert and the restore after an
      # upgrade run against a stub apk, curl and health gate.
      - name: Add-ons on the gateway
        run: UCODE=/tmp/ucode/build/ucode scripts/test-addon.sh

      # The upstream indexes are ~10MB and a pinned release never changes them.
      - name: Cache the upstream package indexes
        uses: actions/cache@v4
        with:
          path: .build/pkgindex
          key: pkgindex-${{ hashFiles('boards/**/board.conf') }}
          restore-keys: pkgindex-

      # Device scripts run under busybox ash. Checked with `sh -n` (dash on
      # Ubuntu, close enough to catch bashisms); build scripts as bash.
      - name: Check shell syntax
        run: |
          fail=0
          for f in build.sh scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done
          while IFS= read -r f; do
            # Shebang-aware: /usr/sbin also holds ucode programs and
            # pulzr-rak-power's Lua, and feeding either to `sh -n` reports a
            # syntax error in perfectly good code.
            case "$(head -c 32 "$f")" in
              '#!'*ucode*|'#!'*lua*) continue ;;
            esac
            sh -n "$f" || { echo "::error file=$f::POSIX sh syntax error"; fail=1; }
          done < <(find feed boards -type f \
                     \( -name '*.conf' -o -path '*/usr/sbin/*' \
                        -o -path '*/etc/init.d/*' -o -path '*/etc/uci-defaults/*' \
                        -o -path '*/hotplug.d/*' -o -path '*/rc.button/*' \
                        -o -path '*/profile.d/*' \))
          exit $fail

      - name: Check JSON
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done < <(find feed -name '*.json')
          exit $fail

      # A bash shebang would work on the build host and fail on a gateway,
      # where /bin/sh is busybox ash and bash is absent.
      - name: No bash in device scripts
        run: |
          # Only what ships: a package's files/. Build-host helpers beside it
          # (feed/*/fetch) run on the build machine and may be bash.
          if grep -rln '#!/bin/bash\|#!/usr/bin/env bash' feed/*/files/; then
            echo "::error::device scripts must be POSIX sh — OpenWrt ships ash, not bash"
            exit 1
          fi

      # Three packages that did not exist in 24.10 — figlet, libgpiod-utils and
      # uqmi — shipped at once, and the only symptom was five image jobs
      # failing after four minutes with the cause buried under a page of
      # "Configuring ...". This asks the release's own indexes instead, in
      # seconds, before anything is built.
      - name: Packages must exist upstream
        run: ./scripts/check-deps.sh

      # The wordmark renderer is a reimplementation of somebody else's format,
      # which is only trustworthy while it is checked against the original.
      - name: FIGlet renderer matches figlet
        run: |
          sudo apt-get install -y figlet
          UCODE=/tmp/ucode/build/ucode scripts/test-figlet.sh

      # OpenWrt's prepare_rootfs executes every uci-defaults script during
      # image assembly, with IPKG_INSTROOT set and absolute paths resolving to
      # the *build host*. An unguarded script there fails the image build at
      # best, and at worst bakes host state — or one shared password — into
      # every gateway flashed from that image. Both have happened; hence a
      # check rather than a comment.
      - name: uci-defaults must defer to first boot
        run: |
          fail=0
          while IFS= read -r f; do
            if ! grep -q 'IPKG_INSTROOT' "$f"; then
              echo "::error file=$f::missing the IPKG_INSTROOT guard"
              fail=1
              continue
            fi
            guard=$(grep -n 'IPKG_INSTROOT' "$f" | head -1 | cut -d: -f1)
            first=$(grep -nvE '^\s*#|^\s*$' "$f" | grep -v '^1:#!' | head -1 | cut -d: -f1)
            if [ "$guard" -gt "$first" ]; then
              echo "::error file=$f,line=$first::code runs before the IPKG_INSTROOT guard"
              fail=1
            fi
          done < <(find feed -path '*/etc/uci-defaults/*' -type f)
          exit $fail

  # ───────────────────────────────────────────────────────────────────────
  # Not after check: nothing here reads what check decides, and waiting for it
  # was half of a warm run before the first image. check gates what leaves the
  # run instead (the add-ons' publish and the release), and a failing check
  # fails the run.
  console:
    name: Console
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build
        run: ./build.sh --stage console

      # The built app, for the feed job to package. Not the whole repo — just
      # what the console stage produced.
      - uses: actions/upload-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: console
          path: feed/pulzr-console/files/www
          retention-days: 1
          if-no-files-found: error

      - name: Hand over the console
        if: runner.environment == 'self-hosted'
        run: |
          h="$HANDOFF/$GITHUB_RUN_ID/console"
          rm -rf "$h"; mkdir -p "$h"
          cp -a feed/pulzr-console/files/www/. "$h/"

  # ───────────────────────────────────────────────────────────────────────
  # The SDK packages and device ImageBuilders are built by prebuilt.yml, which
  # nothing cancels, and only restored here. A board's image job restores its
  # own; the add-ons need every architecture's, which this collects.
  prebuilt:
    name: Collect ${{ matrix.target }}
    needs: boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.boards.outputs.sdk) }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: echo "key=$(sdk/key '${{ matrix.target }}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: .build/sdk
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ strategy.job-index }}
          path: .build/sdk
          retention-days: 1
          if-no-files-found: error

  prebuilt-devices:
    name: Collect ${{ matrix.device }}
    needs: boards
    if: needs.boards.outputs.devices != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.devices) }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: .build/device-ib/${{ matrix.device }}
          key: device-ib-${{ matrix.device }}-${{ matrix.deviceKey }}
          fail-on-cache-miss: true

      - uses: actions/upload-artifact@v4
        with:
          name: device-ib-${{ matrix.device }}
          path: |
            .build/device-ib/${{ matrix.device }}/*.tar.zst
            .build/device-ib/${{ matrix.device }}/sha256sums
          retention-days: 1
          if-no-files-found: error

  feed:
    name: Packages
    needs: console
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: console
          path: feed/pulzr-console/files/www

      - name: Take the console
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p feed/pulzr-console/files/www
          cp -a "$HANDOFF/$GITHUB_RUN_ID/console/." feed/pulzr-console/files/www/

      # The recovery PUBLIC key. Without it images still build, but cannot be
      # adopted offline — build.sh warns rather than failing, which is right
      # for a fork or a PR from somebody without the secret.
      # The secret keeps its original name (PARKEZE_*): renaming it is a change to
      # the repository settings, and the key it holds is not being rotated.
      - name: Install the fleet recovery anchor
        env:
          RECOVERY_PUBKEY: ${{ secrets.PARKEZE_RECOVERY_PUBKEY }}
        run: |
          if [ -n "${RECOVERY_PUBKEY}" ]; then
            printf '%s\n' "${RECOVERY_PUBKEY}" > "${RUNNER_TEMP}/recovery.pub"
            echo "PULZR_RECOVERY_PUBKEY=${RUNNER_TEMP}/recovery.pub" >> "$GITHUB_ENV"
          else
            echo "::warning::No PARKEZE_RECOVERY_PUBKEY secret — images cannot be adopted offline."
          fi

      # The firmware signing PUBLIC key, which is what lets a gateway tell
      # whether Pulzr built an image before it writes it over itself. Same
      # shape and same warn-rather-than-fail reasoning as the anchor above.
      # Only needed here: the image stage receives the overlay as an artifact
      # with this already in it.
      - name: Install the firmware signing key
        env:
          FIRMWARE_PUBKEY: ${{ secrets.PARKEZE_FIRMWARE_PUBKEY }}
        run: |
          if [ -n "${FIRMWARE_PUBKEY}" ]; then
            printf '%s\n' "${FIRMWARE_PUBKEY}" > "${RUNNER_TEMP}/firmware.pub"
            echo "PULZR_FIRMWARE_PUBKEY=${RUNNER_TEMP}/firmware.pub" >> "$GITHUB_ENV"
          else
            echo "::warning::No PARKEZE_FIRMWARE_PUBKEY secret — gateways from this build cannot check whether an image is ours."
          fi

      - name: Cache the host ucode
        uses: actions/cache@v4
        with:
          path: .build/host-ucode
          key: host-ucode-${{ hashFiles('scripts/host-ucode.sh') }}

      # The noarch half: every package with no arches file. An arch package's
      # binary comes from its architecture's SDK build, so each board stages
      # its own beside its image and waits on no other architecture's.
      # cmake and json-c: scripts/host-ucode.sh builds the compiler that ships
      # the feed's ucode as bytecode.
      - name: Build the package feed
        env:
          PULZR_FEED_ARCHES: noarch
        run: |
          sudo apt-get install -y cmake libjson-c-dev
          ./build.sh --stage feed

      # Both halves of the overlay travel together: the staged feed, and the
      # recovery key that install_fleet_key dropped into the board files.
      - uses: actions/upload-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: feed
          path: |
            .build/feed
            boards/common/files
          retention-days: 1
          if-no-files-found: error

      - name: Hand over the feed
        if: runner.environment == 'self-hosted'
        run: |
          h="$HANDOFF/$GITHUB_RUN_ID/feed"
          rm -rf "$h"; mkdir -p "$h"
          cp -a --parents .build/feed boards/common/files "$h/"

  # ───────────────────────────────────────────────────────────────────────
  # The add-ons are the packages with a feed/*/addon file. Images do not carry
  # them; a gateway installs one from a repository per release and architecture
  # (docs/src/content/docs/addons.md). Runs on every push, so a broken add-on, or an apk that no
  # longer reads what we sign, fails here and not on the first tag.
  #
  # Secrets, all optional, and in the `release` environment, which only a
  # version tag can use: a push to a branch, a fork or a PR builds against a
  # throwaway key and uploads nothing, so the real key is in no run but a
  # release's.
  #   PULZR_ADDONS_APK_KEY          the repository's private key (ECDSA P-256 PEM,
  #                                 the whole file); public half is committed at
  #                                 feed/pulzr-base/files/etc/apk/keys/
  #   R2_ACCOUNT_ID                 Cloudflare account that holds curb-public
  #   R2_ADDONS_ACCESS_KEY_ID       R2 token with write access to curb-public
  #   R2_ADDONS_SECRET_ACCESS_KEY
  addons:
    name: Add-ons
    # devices: an upstream package for a source-only target (the GL-SFT1200's
    # siflower) resolves against that board's own ImageBuilder
    # (scripts/addon-upstream.sh).
    # Every architecture's SDK packages (prebuilt) and the device
    # ImageBuilders (prebuilt-devices): an upstream package for a source-only
    # target (the GL-SFT1200's siflower) resolves against that board's own
    # ImageBuilder (scripts/addon-upstream.sh). Not on any image's path.
    needs: [check, feed, boards, prebuilt, prebuilt-devices]
    # A collector that found nothing fails, and the add-ons with it; a missing
    # graft ImageBuilder also fails build-addons.sh by name.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.feed.result == 'success' && needs.boards.result == 'success' && needs.prebuilt.result == 'success' }}
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'build' }}
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    env:
      R2_BUCKET: curb-public
      ADDONS_PREFIX: pulzros/addons
      ADDONS_URL: https://assets.pkze.us/pulzros/addons
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: feed

      - name: Take the feed
        if: runner.environment == 'self-hosted'
        run: cp -a "$HANDOFF/$GITHUB_RUN_ID/feed/." .

      # Each into .build/device-ib/<board>/, where build-addons.sh looks.
      - uses: actions/download-artifact@v4
        if: needs.boards.outputs.devices != '[]'
        with:
          pattern: device-ib-*
          path: .build/device-ib-artifacts

      - name: Place the device ImageBuilders
        if: needs.boards.outputs.devices != '[]'
        run: |
          for d in .build/device-ib-artifacts/device-ib-*/; do
            dev="$(basename "${d}")"; dev="${dev#device-ib-}"
            mkdir -p .build/device-ib
            rm -rf ".build/device-ib/${dev}"
            mv "${d}" ".build/device-ib/${dev}"
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: .build/sdk
          merge-multiple: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd jq cmake libjson-c-dev

      - name: Cache the host ucode
        uses: actions/cache@v4
        with:
          path: .build/host-ucode
          key: host-ucode-${{ hashFiles('scripts/host-ucode.sh') }}

      # Every architecture's arch packages, under the feed job's build stamp:
      # an add-on pins the pulzr-base the images carry. Not the noarch half,
      # which the feed job staged and which needs the console this job lacks.
      - name: Stage every architecture
        env:
          ARCHES: ${{ needs.boards.outputs.arches }}
        run: |
          [ -n "${ARCHES}" ] || ARCHES="$(awk '!/^[[:space:]]*#/ && NF { print $1 }' feed/*/arches | sort -u | xargs)"
          PULZR_FEED_ARCHES="${ARCHES}" PULZR_BUILD="$(cat .build/feed/BUILD)" ./build.sh --stage feed

      # Only the apk inside it is used, and it is the same in every
      # ImageBuilder, so rpi4's, which that board's image job already caches.
      # The key is that job's: 25.12.6-bcm27xx-bcm2711 is its imagebuilder_id.
      - name: Cache the ImageBuilder
        uses: actions/cache@v4
        with:
          path: .build/imagebuilder
          key: imagebuilder-25.12.6-bcm27xx-bcm2711

      - name: Build and sign the repository
        env:
          APK_KEY: ${{ secrets.PULZR_ADDONS_APK_KEY }}
          # Every board's on a push or a tag; a dispatch's boards' otherwise.
          PULZR_ADDON_ARCHES: ${{ needs.boards.outputs.arches }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            export PULZR_ADDONS_TAG="${GITHUB_REF_NAME}"
          fi
          if [ -n "${APK_KEY}" ]; then
            umask 077
            key="${RUNNER_TEMP}/addons-apk-key.pem"
            printf '%s\n' "${APK_KEY}" > "${key}"
            trap 'rm -f "${key}"' EXIT
            export PULZR_ADDONS_APK_KEY_FILE="${key}"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "::warning::No PULZR_ADDONS_APK_KEY secret: signed with a throwaway key, so this repository cannot be published."
          fi
          ./build.sh --stage addons

      - name: Summarize
        run: |
          {
            echo "### Add-ons"
            echo
            echo '```'
            jq -r '.addons[] | .name as $n | .arches | to_entries[]
                   | "\($n) \(.key) \(.value.file) \(.value.bytes) bytes"' out/addons/addons.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Immutable paths: a tag that already has a repository is refused rather
      # than overwritten, because a gateway that rolled back restores its
      # add-ons from the old release's path and must find what it left.
      - name: Publish to R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ADDONS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ADDONS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::R2 secrets are not set: the add-on repository for ${GITHUB_REF_NAME} was built but NOT uploaded."
            exit 0
          fi
          if [ ! -f out/addons/PUBLISHABLE ]; then
            echo "::warning::The repository was not signed with PULZR_ADDONS_APK_KEY: built but NOT uploaded."
            exit 0
          fi

          # A pinned AWS CLI when the runner has none, checked against the
          # sha256 recorded here, as every other download in this repo is.
          if ! command -v aws >/dev/null 2>&1; then
            v=2.31.0 want=f5fbb3304307ce008756356fadf7855d377b4342da9911728669265ec1ec36dc
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/awscli.zip" \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${v}.zip"
            [ "$(sha256sum "${RUNNER_TEMP}/awscli.zip" | cut -d' ' -f1)" = "${want}" ] \
              || { echo "::error::checksum mismatch for the AWS CLI"; exit 1; }
            unzip -q "${RUNNER_TEMP}/awscli.zip" -d "${RUNNER_TEMP}/awscli"
            "${RUNNER_TEMP}/awscli/aws/install" --install-dir "${RUNNER_TEMP}/aws-cli" --bin-dir "${RUNNER_TEMP}/aws-bin"
            export PATH="${RUNNER_TEMP}/aws-bin:${PATH}"
          fi

          export AWS_DEFAULT_REGION=auto
          # R2 does not take the CRC headers newer AWS CLIs add by default.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          ep="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          base="${ADDONS_PREFIX}/${GITHUB_REF_NAME}"
          cc="public, max-age=31536000, immutable"

          # An error here must not read as "does not exist".
          existing="$(aws s3api list-objects-v2 --endpoint-url "${ep}" --bucket "${R2_BUCKET}" \
                        --prefix "${base}/addons.json" --max-keys 1 --query 'Contents[0].Key' --output text)" \
            || { echo "::error::could not list ${R2_BUCKET}/${base}/"; exit 1; }
          if [ "${existing}" != None ]; then
            echo "::error::${base}/addons.json already exists in ${R2_BUCKET}. Published repositories are immutable; cut a new tag."
            exit 1
          fi

          # The index and packages first, the catalog last: the catalog is what
          # says a release is complete, so a half-sent one is not offered.
          for dir in out/addons/*/; do
            arch="$(basename "${dir}")"
            for f in "${dir}"*.apk; do
              aws s3 cp --endpoint-url "${ep}" --cache-control "${cc}" \
                --content-type application/octet-stream "${f}" "s3://${R2_BUCKET}/${base}/${arch}/$(basename "${f}")"
            done
            aws s3 cp --endpoint-url "${ep}" --cache-control "${cc}" \
              --content-type application/octet-stream "${dir}packages.adb" "s3://${R2_BUCKET}/${base}/${arch}/packages.adb"
          done
          aws s3 cp --endpoint-url "${ep}" --cache-control "${cc}" \
            --content-type application/json out/addons/addons.json "s3://${R2_BUCKET}/${base}/addons.json"

          # Fetched back from the public URL, which is what a gateway uses.
          want="$(sha256sum out/addons/addons.json | cut -d' ' -f1)"
          for _ in 1 2 3 4 5; do
            got="$(curl -fsS "${ADDONS_URL}/${GITHUB_REF_NAME}/addons.json" | sha256sum | cut -d' ' -f1)" || got=
            [ "${got}" = "${want}" ] && { echo "published ${ADDONS_URL}/${GITHUB_REF_NAME}/"; exit 0; }
            sleep 5
          done
          echo "::error::${ADDONS_URL}/${GITHUB_REF_NAME}/addons.json is not served as uploaded"
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  boards:
    name: Discover boards
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      # What the add-ons collect and pack, from the matrix, so a dispatch for
      # one board narrows them too: its SDK target, its device ImageBuilder,
      # its architecture.
      sdk: ${{ steps.list.outputs.sdk }}
      devices: ${{ steps.list.outputs.devices }}
      arches: ${{ steps.list.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          # Through the environment rather than interpolated into the script: a
          # workflow_dispatch input is arbitrary text, and pasting it into a
          # shell line is a command injection waiting for a backtick.
          REQUESTED: ${{ inputs.boards }}
        run: |
          # Each entry carries its target and subtarget, so the image job can
          # key its ImageBuilder cache on the download rather than on the board.
          # --list-json reports every board including the ones with no upstream
          # device support; the matrix takes only what can actually be built,
          # so a board waiting on a DTS does not turn the run red.
          all="$(./build.sh --list-json | jq -c '[.[] | select(.status == "supported")]')"
          held="$(./build.sh --list-json | jq -r '.[] | select(.status != "supported") | "  \(.board): \(.status)"')"
          if [ -n "${held}" ]; then
            echo "Not built (no upstream device profile):"
            echo "${held}"
            { echo "### Boards held back"; echo; echo '```'; echo "${held}"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${REQUESTED}" ]; then
            wanted="$(printf '%s' "${REQUESTED}" | tr ' ' '\n' \
                      | grep -v '^[[:space:]]*$' | jq -R . | jq -sc .)"
            matrix="$(jq -c --argjson w "${wanted}" \
                       '[.[] | select(.board as $b | $w | index($b))]' <<<"${all}")"
          else
            matrix="${all}"
          fi

          [ "$(jq 'length' <<<"${matrix}")" -gt 0 ] \
            || { echo "::error::no boards matched"; exit 1; }

          {
            echo "matrix=${matrix}"
            # A push or a tag packs every add-on the release ships, a board
            # waiting on device support's architecture included (arches empty:
            # all); a dispatch, its boards' only.
            if [ -n "${REQUESTED}" ]; then
              echo "sdk=$(jq -c '[.[].sdk] | unique' <<<"${matrix}")"
              echo "devices=$(jq -c '[.[] | select(.device != "") | {device, deviceKey}] | unique' <<<"${matrix}")"
              echo "arches=$(jq -r '[.[].arch] | unique | join(" ")' <<<"${matrix}")"
            else
              echo "sdk=$(sdk/targets | jq -Rsc 'split("\n") | map(select(. != ""))')"
              echo "devices=$(./build.sh --list-json | jq -c '[.[] | select(.device != "") | {device, deviceKey}] | unique')"
              echo "arches="
            fi
          } >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.board)  \(.target)/\(.subtarget)"' <<<"${matrix}"

  image:
    name: ${{ matrix.board }}
    # The noarch feed and the board list, nothing per target: each board
    # restores its own target's SDK packages and device ImageBuilder below, so
    # none waits on another target's, and one that is not built yet waits alone.
    needs: [feed, boards]
    permissions:
      contents: read
      # To start prebuilt.yml for a build it finds missing.
      actions: write
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    strategy:
      # One board failing should not hide whether the others build — a broken
      # RAK profile must not mask a working Pi image.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: console
          path: feed/pulzr-console/files/www

      - uses: actions/download-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          name: feed

      - name: Take the console and the feed
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p feed/pulzr-console/files/www
          cp -a "$HANDOFF/$GITHUB_RUN_ID/console/." feed/pulzr-console/files/www/
          cp -a "$HANDOFF/$GITHUB_RUN_ID/feed/." .

      # Built by prebuilt.yml, restored here by the same keys.
      - id: sdk
        uses: actions/cache/restore@v4
        with:
          path: .build/sdk
          key: ${{ matrix.sdkKey }}

      - id: device
        if: matrix.device != ''
        uses: actions/cache/restore@v4
        with:
          path: .build/device-ib/${{ matrix.device }}
          key: device-ib-${{ matrix.device }}-${{ matrix.deviceKey }}

      # Not built yet: this board waits, says why, and starts the build if no
      # prebuilt run is already doing it. The job stays green so a waiting
      # board does not read as a broken one; a release refuses to go out
      # without every board (the release job).
      - name: Waiting on prebuilt
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_HIT: ${{ steps.sdk.outputs.cache-hit }}
          DEVICE_HIT: ${{ matrix.device == '' && 'true' || steps.device.outputs.cache-hit }}
        run: |
          missing=""
          [ "${SDK_HIT}" = true ] || missing="the ${{ matrix.sdk }} SDK packages (${{ matrix.sdkKey }})"
          [ "${DEVICE_HIT}" = true ] || missing="${missing:+${missing} and }the ${{ matrix.device }} ImageBuilder (${{ matrix.deviceKey }})"
          if [ -z "${missing}" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::${{ matrix.board }} waits on ${missing}, which prebuilt.yml has not built yet."
          { echo "### ${{ matrix.board }} waits"; echo; echo "On ${missing}: prebuilt.yml builds it, and the next run builds this board."; } >> "$GITHUB_STEP_SUMMARY"
          active="$(gh run list -R "${GITHUB_REPOSITORY}" -w prebuilt.yml -L 5 --json status \
                      -q '[.[] | select(.status != "completed")] | length' || echo 0)"
          if [ "${active}" = 0 ]; then
            gh workflow run prebuilt.yml -R "${GITHUB_REPOSITORY}" --ref "${{ github.event.repository.default_branch }}" \
                -f boards="${{ matrix.board }}" \
              && echo "Started prebuilt.yml for ${{ matrix.board }}." || echo "::warning::Could not start prebuilt.yml."
          else
            echo "prebuilt.yml is already running."
          fi
          echo "go=false" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.ready.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zstd unzip \
                                  file wget python3 rsync cmake libjson-c-dev

      - name: Cache the host ucode
        if: steps.ready.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: .build/host-ucode
          key: host-ucode-${{ hashFiles('scripts/host-ucode.sh') }}

      # This board's architecture of the arch packages (pulzr-probe and the
      # like), whose binaries are in the SDK packages restored above, under the
      # feed job's build stamp so the whole release carries one.
      - name: Stage ${{ matrix.arch }}
        if: steps.ready.outputs.go == 'true'
        env:
          PULZR_FEED_ARCHES: ${{ matrix.arch }}
        run: PULZR_BUILD="$(cat .build/feed/BUILD)" ./build.sh --stage feed

      # Keyed on the ImageBuilder itself — version, target, subtarget, and where
      # it comes from — not on the board, so boards sharing a download share a
      # cache entry.
      - name: Cache the ImageBuilder
        if: steps.ready.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: .build/imagebuilder
          key: imagebuilder-${{ matrix.imagebuilder }}

      - name: Assemble ${{ matrix.board }}
        if: steps.ready.outputs.go == 'true'
        run: ./build.sh --stage image "${{ matrix.board }}"

      # ImageBuilder failures are often a package that will not resolve, and
      # the useful line scrolls past in a wall of "Configuring ...". Surface it.
      - name: Explain a failure
        if: failure()
        run: |
          echo "### ${{ matrix.board }} failed" >> "$GITHUB_STEP_SUMMARY"
          log=".build/imagebuilder/${{ matrix.imagebuilder }}/logs/package/install.txt"
          if [ -f "$log" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Packages requested:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls .build/feed/*.tar 2>/dev/null | xargs -n1 basename >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ImageBuilder's filenames say everything except which file to write to a
      # card. This renames the right one, produces the .img.xz Pi Imager wants,
      # and emits that board's entry for the OS list.
      - name: Package for humans
        if: steps.ready.outputs.go == 'true'
        run: ./scripts/package-images.sh "${{ matrix.board }}" "$(cat VERSION)"

      - name: Summarize
        if: steps.ready.outputs.go == 'true'
        run: |
          {
            echo "### ${{ matrix.board }} · ${{ matrix.target }}/${{ matrix.subtarget }}"
            echo
            echo '| Image | Size |'
            echo '|---|---|'
            find out/release -maxdepth 1 -type f \
                 \( -name "*${{ matrix.board }}*.img.gz" -o -name "*${{ matrix.board }}*.img.xz" \
                    -o -name "*${{ matrix.board }}*.bin" \) \
                 -printf '| `%f` | %s bytes |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # The friendly build: one image to write, one to upgrade with, checksums,
      # and the OS list fragment. Not the raw ImageBuilder output, which is
      # four cryptic files nobody can choose between.
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true' && runner.environment == 'github-hosted'
        with:
          name: pulzros-${{ matrix.board }}
          path: out/release/*
          # Long enough to flash a unit next week, short enough that the
          # storage quota is not spent on every push to a branch.
          retention-days: 14
          if-no-files-found: error

      - name: Hand over the images
        if: steps.ready.outputs.go == 'true' && runner.environment == 'self-hosted'
        env:
          BOARD: ${{ matrix.board }}
        run: |
          h="$HANDOFF/$GITHUB_RUN_ID/images/${BOARD}"
          rm -rf "$h"; mkdir -p "$h"
          cp -a out/release/. "$h/"
          [ -n "$(ls -A "$h")" ] || { echo "::error::no images for ${BOARD}"; exit 1; }

  # ───────────────────────────────────────────────────────────────────────
  release:
    name: Release
    environment: release
    if: startsWith(github.ref, 'refs/tags/')
    # Not the add-ons: they publish to their own bucket, and a firmware fix
    # must never wait on, or be blocked by, an add-on that failed to build.
    needs: [check, image, boards]
    runs-on: ${{ (github.event.repository.private && vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # No checkout in this job, so on the self-hosted runner its directory
      # still holds the last release's files. Publishing those would attach
      # another version's images to this tag.
      - name: Start clean
        run: rm -rf artifacts release

      - uses: actions/download-artifact@v4
        if: runner.environment == 'github-hosted'
        with:
          pattern: pulzros-*
          path: artifacts

      - name: Take the images
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p artifacts
          cp -a "$HANDOFF/$GITHUB_RUN_ID/images/." artifacts/

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.img.gz' -o -name '*.img.xz' -o -name '*.bin' \) \
               -exec cp {} release/ \;
          ( cd release && sha256sum ./* > sha256sums.txt )
          ls -la release

      # A board waiting on prebuilt.yml finishes green with no image, so a push
      # is not red for it; a release is every board or nothing.
      - name: Every board built
        env:
          MATRIX: ${{ needs.boards.outputs.matrix }}
        run: |
          missing=""
          for b in $(jq -r '.[].board' <<<"${MATRIX}"); do
            compgen -G "release/*-${b}[.-]*" >/dev/null || missing="${missing} ${b}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::No image for${missing}: a release needs every board. Wait for prebuilt.yml, then retag."
            exit 1
          fi

      # Sign each image, so a gateway can tell it is ours before it writes one
      # over itself. Produces <image>.pulzr.json beside each, which travels
      # with the image and is what pulzr-firmware verifies.
      #
      # A release without the key fails: gateways refuse an unsigned image
      # (firmware.uc), so one would be a release nothing can install.
      - name: Sign images
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -z "${FIRMWARE_SIGNING_KEY}" ]; then
            echo "::error::FIRMWARE_SIGNING_KEY is not set; a release must be signed"
            exit 1
          fi

          umask 077
          key="$(mktemp)"
          printf '%s\n' "${FIRMWARE_SIGNING_KEY}" > "${key}"
          trap 'rm -f "${key}"' EXIT

          for image in release/*.img.gz release/*.img.xz release/*.bin; do
            [ -f "${image}" ] || continue

            digest="$(sha256sum "${image}" | awk '{ print $1 }')"

            # -A on every base64: openssl wraps at 64 columns by default, and a
            # wrapped value inside a JSON string is a different string from the
            # one that was signed. pulzr-adopt hit exactly this.
            # version is what a gateway's downgrade check orders by, and those
            # up to 0.4.0-rc8 read a dotted pre-release (rc.9) as rc 0, older
            # than their own rc8, and refuse it as a downgrade. So it is
            # written undotted (v0.4.0-rc9), which they order correctly and
            # newer gateways read as the same release (firmware.uc,
            # olderThan). tag is the release's own name, which newer gateways
            # find its add-on repository by (pulzr-addon carry).
            compat="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/-([A-Za-z]+)\.([0-9]+)$/-\1\2/')"
            manifest="$(printf '{"sha256":"%s","board":"","version":"%s","tag":"%s","built":"%s"}' \
                          "${digest}" "${compat}" "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                        | openssl base64 -A)"

            # Through a file, not a pipe. Ed25519 signing is one-shot: openssl
            # needs the whole input size up front and a pipe cannot give it
            # one, failing with "unable to determine file size for oneshot
            # operation". The gateway's verifier writes a file for the same
            # reason.
            body="$(mktemp)"; printf '%s' "${manifest}" > "${body}"
            signature="$(openssl pkeyutl -sign -inkey "${key}" -rawin -in "${body}" \
                         | openssl base64 -A)"

            # Verified here, against the public half, before anyone relies on
            # it. A manifest that does not verify on the machine that just made
            # it will not verify on a gateway either, and this is a far better
            # place to find that out than a fleet that refuses every image.
            pub="$(mktemp)"; sig="$(mktemp)"
            openssl pkey -in "${key}" -pubout -out "${pub}" 2>/dev/null
            printf '%s' "${signature}" | openssl base64 -d -A > "${sig}"
            if ! openssl pkeyutl -verify -pubin -inkey "${pub}" -rawin \
                   -in "${body}" -sigfile "${sig}" >/dev/null 2>&1; then
              echo "::error::the signature produced for ${image} does not verify"
              exit 1
            fi
            rm -f "${body}" "${pub}" "${sig}"

            printf '{"manifest":"%s","signature":"%s"}\n' "${manifest}" "${signature}" \
              > "${image}.pulzr.json"
            echo "signed ${image} (${digest})"
          done
          ls -la release

      # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
      # -F notes.md), else GitHub's generated notes; never none. From the API:
      # this job has no checkout.
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          : > "${notes}"
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" -q '.object.type + " " + .object.sha')"
          if [ "${ref%% *}" = tag ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref#* }" -q .message \
              | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          body_path: ${{ runner.temp }}/notes.md
          # v0.4.0-rc1 and the like are pre-releases: net-api installs one by
          # its tag but never offers it as the latest to a gateway.
          prerelease: ${{ contains(github.ref_name, '-') }}
