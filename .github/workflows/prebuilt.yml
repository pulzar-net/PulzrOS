# The slow builds, done once per change and never cancelled.
#
#   sdk       the per-target packages from the OpenWrt SDK (sdk/build.sh): the
#             LoRa packages, busybox, pulzr-probe and pulzr-edge's binaries.
#             Cached by sdk/key.
#   devices   the ImageBuilder for each board with device support
#             (scripts/device-imagebuilder.sh). Cached by its device key.
#
# A cold build is hours: the SDK compiles Rust and LLVM, a device ImageBuilder
# the toolchain and kernel. They used to run inside build.yml, whose
# cancel-in-progress drops a superseded run, and a cache is only saved when its
# job finishes: on 23 Nov 2026 four pushes in an hour cancelled the LoRa builds
# four times, and the cache was never saved. Here each target and each device
# is its own concurrency group that never cancels a running job, and each job
# saves its cache the moment it is built. build.yml only restores; a board
# whose build is not cached yet waits, and says so, without holding up the
# boards whose builds are.
#
# The keys are sdk/key and build.sh's device_key, which hash everything that
# decides what is built, so a push here that changes none of it finds every
# cache and does nothing in a minute.

name: prebuilt

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'boards/common/board.conf'
      - 'boards/*/openwrt/**'
      - 'scripts/device-imagebuilder.sh'
      - 'scripts/device-imagebuilder-graft.sh'
      - 'scripts/busybox-quiet-config.sh'
      - '.github/workflows/prebuilt.yml'
  # build.yml dispatches this for a build it finds missing (an evicted cache,
  # or a push that changed one before this ran), for the boards that wait.
  workflow_dispatch:
    inputs:
      boards:
        description: 'Only what these boards need (space separated). Empty builds all.'
        required: false
        type: string

permissions:
  contents: read
  # To start build.yml once a build is saved, for the boards that waited on it.
  actions: write

jobs:
  list:
    name: List
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.list.outputs.sdk }}
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      # Every SDK target and every board's device support, the boards waiting
      # on it included, so a change to one is built the day it is made; or a
      # dispatch's boards' only. Through the environment: the input is
      # arbitrary text.
      - id: list
        env:
          REQUESTED: ${{ inputs.boards }}
        run: |
          all="$(./build.sh --list-json)"
          if [ -n "${REQUESTED}" ]; then
            wanted="$(printf '%s' "${REQUESTED}" | tr ' ' '\n' | grep -v '^[[:space:]]*$' | jq -R . | jq -sc .)"
            all="$(jq -c --argjson w "${wanted}" '[.[] | select(.board as $b | $w | index($b))]' <<<"${all}")"
            echo "sdk=$(jq -c '[.[].sdk] | unique' <<<"${all}")" >> "$GITHUB_OUTPUT"
          else
            echo "sdk=$(./build.sh --sdk-targets | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          fi
          echo "devices=$(jq -c '[.[] | select(.device != "") | {device, deviceKey}] | unique' <<<"${all}")" >> "$GITHUB_OUTPUT"

  sdk:
    name: SDK (${{ matrix.target }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # One build per target at a time, and a running one is never cancelled: a
    # later run waits, then finds the cache this one saved.
    concurrency:
      group: prebuilt-sdk-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.sdk) }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: echo "key=$(sdk/key '${{ matrix.target }}')" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v4
        with:
          path: .build/sdk
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Rust, LLVM and the SDK want tens of GB; the image starts with about 14.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          tool-cache: true

      # OpenWrt's build prerequisites for Ubuntu, and clang for bindgen.
      - name: Install the SDK's prerequisites
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Build
        if: steps.cached.outputs.cache-hit != 'true'
        run: sdk/build.sh '${{ matrix.target }}' .build/sdk

      - uses: actions/cache/save@v4
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: .build/sdk
          key: ${{ steps.key.outputs.key }}

      - name: Cache size
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.key.outputs.key }}: $(du -sh .build/sdk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # The boards that waited on this build get it now, not on the next push.
      - name: Build the boards that waited
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml -R "${GITHUB_REPOSITORY}" --ref "${{ github.event.repository.default_branch }}"

  devices:
    name: Device support (${{ matrix.device }})
    needs: list
    if: needs.list.outputs.devices != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: prebuilt-device-${{ matrix.device }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4

      - id: cached
        uses: actions/cache/restore@v4
        with:
          path: .build/device-ib/${{ matrix.device }}
          key: device-ib-${{ matrix.device }}-${{ matrix.deviceKey }}
          lookup-only: true

      # The buildroot wants ~25GB; a stock runner has that only once the
      # preinstalled SDKs are gone.
      - name: Free disk and install the buildroot dependencies
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      # OpenWrt's source tarballs, one cache per OpenWrt release for every
      # board: they are the same sources, and one per board (1.2-1.4 GB each)
      # filled the repository's 10 GB, so saving a build evicted the others
      # and everything went cold. Linked in as the tree's dl/, which the
      # device scripts keep across a fresh clone. The first board to finish
      # saves it; a board whose sources it lacks downloads those, minutes
      # against the hours of the build.
      - id: release
        if: steps.cached.outputs.cache-hit != 'true'
        run: echo "openwrt=$(sed -n 's/^OPENWRT_VERSION="\(.*\)"/\1/p' boards/common/board.conf)" >> "$GITHUB_OUTPUT"

      - id: dl
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .build/openwrt-dl
          key: openwrt-dl-${{ steps.release.outputs.openwrt }}

      - name: Link the shared sources
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build/openwrt-dl ".build/device/${{ matrix.device }}/openwrt"
          rm -rf ".build/device/${{ matrix.device }}/openwrt/dl"
          ln -s "${GITHUB_WORKSPACE}/.build/openwrt-dl" ".build/device/${{ matrix.device }}/openwrt/dl"

      - name: Build
        id: build
        if: steps.cached.outputs.cache-hit != 'true'
        run: scripts/device-imagebuilder.sh "${{ matrix.device }}" ".build/device-ib/${{ matrix.device }}"

      # Saved even when the build fails or is cancelled, so a retry does not
      # download them again. A cache key is written once: if another board
      # saved it first, this is a no-op.
      - uses: actions/cache/save@v4
        if: always() && steps.cached.outputs.cache-hit != 'true' && steps.dl.outputs.cache-hit != 'true'
        with:
          path: .build/openwrt-dl
          key: openwrt-dl-${{ steps.release.outputs.openwrt }}

      - uses: actions/cache/save@v4
        if: steps.build.outcome == 'success'
        with:
          path: .build/device-ib/${{ matrix.device }}
          key: device-ib-${{ matrix.device }}-${{ matrix.deviceKey }}

      - name: Cache size
        if: always() && steps.cached.outputs.cache-hit != 'true'
        run: |
          {
            [ -d ".build/device-ib/${{ matrix.device }}" ] && echo "device-ib-${{ matrix.device }}-${{ matrix.deviceKey }}: $(du -sh ".build/device-ib/${{ matrix.device }}" | cut -f1)"
            echo "openwrt-dl-${{ steps.release.outputs.openwrt }}: $(du -sh .build/openwrt-dl/ | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the boards that waited
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml -R "${GITHUB_REPOSITORY}" --ref "${{ github.event.repository.default_branch }}"
